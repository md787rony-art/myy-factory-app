<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কারখানা মিস্ত্রি পোর্টাল</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: linear-gradient(135deg, #fbcfe8 0%, #e2e8f0 100%); color: #000; padding: 15px; min-height: 100vh; }
        .box-3d { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15), inset 0 -4px 0 rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.8); margin-bottom: 20px; }
        h2, h3 { color: #000; margin-bottom: 15px; }
        .login-screen { max-width: 400px; margin: 60px auto; text-align: center; }
        .dashboard { display: none; max-width: 700px; margin: 0 auto; }
        input, select { width: 100%; padding: 12px; margin: 10px 0 18px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; background: #f8fafc; color: #000; font-weight: 500; }
        button { width: 100%; padding: 14px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button:active { transform: translateY(2px); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .stat-card { background: #000; padding: 15px; border-radius: 10px; text-align: center; color: #fff; }
        .stat-card h4 { font-size: 14px; color: #ccc; }
        .stat-card p { font-size: 22px; font-weight: bold; margin-top: 5px; }
        .stat-card.balance-card { background: #fff; color: #000; border: 2px solid #000; }
        .hidden { display: none; }
        .history-item { padding: 12px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 15px; color: #000; }
    </style>
</head>
<body>

<div id="login-block" class="box-3d login-screen">
    <h2>🏭 কারখানা মিস্ত্রি লগইন</h2>
    <input type="text" id="username" placeholder="আপনার ইউজারনেম দিন">
    <input type="password" id="password" placeholder="আপনার পাসওয়ার্ড দিন">
    <button onclick="handleLogin()">🔐 একাউন্টে প্রবেশ করুন</button>
</div>

<div id="dashboard-block" class="dashboard">
    <div class="box-3d">
        <h3 id="user-welcome">স্বাগতম মিস্ত্রি</h3>
        <div class="stats-grid">
            <div class="stat-card"><h4>মোট হাজিরা</h4><p id="stat-hajira">0</p></div>
            <div class="stat-card"><h4>মোট বিল (পাওনা)</h4><p id="stat-earned">0 ৳</p></div>
            <div class="stat-card"><h4>মোট গ্রহণ (দেনা)</h4><p id="stat-paid">0 ৳</p></div>
            <div class="stat-card balance-card"><h4>নিট বকেয়া</h4><p id="stat-balance">0 ৳</p></div>
        </div>
    </div>

    <div class="box-3d">
        <h3>📝 নতুন কাজের বিবরণ জমা দিন</h3>
        <form id="reportForm" onsubmit="submitReport(event)">
            <label><b>ধাপ ১: কাজের ধরণ</b></label>
            <select id="work-type" onchange="updateFormFlow()" required>
                <option value="">--বাছাই করুন--</option>
                <option value="হাজিরা">হাজিরা ভিত্তিক কাজ</option>
                <option value="কন্ট্রাক্ট">কন্ট্রাক্ট ভিত্তিক কাজ</option>
            </select>

            <div id="hajira-fields" class="hidden">
                <label><b>কয় ঘণ্টা কাজ করেছেন?</b></label>
                <select id="work-hours" onchange="calculateHajiraAmount()">
                    <option value="0">--ঘণ্টা সিলেক্ট করুন--</option>
                    <option value="4">৪ ঘণ্টা (আধা হাজিরা)</option>
                    <option value="8">৮ ঘণ্টা (এক হাজিরা)</option>
                    <option value="12">১২ ঘণ্টা (দের হাজিরা)</option>
                </select>
            </div>

            <div id="dynamic-flow" class="hidden">
                <label><b>ধাপ ২: নির্দিষ্ট কাজের আইটেম</b></label>
                <select id="furniture-item" required>
                    <option value="অফিস টেবিল">অফিস টেবিল কাটিং/তৈরি</option>
                    <option value="আলমিরা">আলমিরা ফিٹنگ/কালার</option>
                    <option value="ড্রেসিং টেবিল">ড্রেসিং টেবিল নকশা</option>
                    <option value="ওয়ারড্রব">ওয়ারড্রব কাজ</option>
                    <option value="শোকেস">শোকেস নকশা কাটিং</option>
                    <option value="খাট">খাট তৈরি</option>
                </select>

                <label><b>ধাপ ৩: টাকার পরিমাণ (৳)</b></label>
                <input type="number" id="amount" placeholder="টাকার অংক" required>
                
                <label><b>📸 মেমো বা কাজের ছবির লিংক (যদি থাকে)</b></label>
                <input type="text" id="photo-link" placeholder="ছবির ইউআরএল বা লিংক দিন">
                
                <button type="submit" id="submit-btn">📤 মালিকের কাছে পাঠান</button>
            </div>
        </form>
    </div>

    <div class="box-3d">
        <h3>📊 অনুমোদিত কাজের ইতিহাস</h3>
        <div id="history-list"></div>
    </div>
</div>

<script>
    // 🔗 আপনার দেওয়া আসল লিংকটি এখানে নিখুঁতভাবে বসিয়ে দেওয়া হয়েছে
    const JSON_URL = "https://md787rony-art.github.io/myy-factory-app/ssdd.json"; 
    let dbData = {};
    let activeUser = {};

    function handleLogin() {
        const u = document.getElementById("username").value.trim().toLowerCase();
        const p = document.getElementById("password").value;

        fetch(JSON_URL, { cache: "no-store" })
        .then(res => res.json())
        .then(db => {
            dbData = db;
            const localLedger = JSON.parse(localStorage.getItem('local_ledger') || '[]');
            const combinedLedger = [...dbData.ledger, ...localLedger];

            const user = dbData.users.find(user => user.username === u && user.password === p);
            if (user) {
                activeUser = user;
                document.getElementById("login-block").style.display = "none";
                document.getElementById("dashboard-block").style.display = "block";
                setupDashboard(combinedLedger);
            } else { alert("❌ ভুল ইউজারনেম বা পাসওয়ার্ড!"); }
        }).catch(() => alert("ডাটা ফাইল লোড করতে সমস্যা হচ্ছে! আপনার ssdd.json ফাইলটি গিটহাবে ঠিকমতো আছে কিনা চেক করুন।"));
    }

    function setupDashboard(ledger) {
        document.getElementById("user-welcome").innerText = `👤 ইউজার: ${activeUser.username.toUpperCase()} (${activeUser.title})`;
        
        let totalEarned = 0, totalPaid = 0, totalHajira = 0;
        const histContainer = document.getElementById("history-list");
        histContainer.innerHTML = "";

        ledger.forEach(h => {
            if(h.username === activeUser.username && h.status === 'Approved') {
                totalEarned += parseFloat(h.amount || 0);
                totalPaid += parseFloat(h.paid_amount || 0);
                totalHajira += parseFloat(h.hajira_count || 0);
                histContainer.innerHTML += `<div class="history-item"><span>📅 ${h.date} - ${h.details} (${h.time})</span><strong>${h.amount} ৳</strong></div>`;
            }
        });

        document.getElementById("stat-hajira").innerText = totalHajira;
        document.getElementById("stat-earned").innerText = totalEarned + " ৳";
        document.getElementById("stat-paid").innerText = totalPaid + " ৳";
        document.getElementById("stat-balance").innerText = (totalEarned - totalPaid) + " ৳";
        if(!histContainer.innerHTML) histContainer.innerHTML = "<p>কোনো ইতিহাস পাওয়া যায়নি।</p>";
    }

    function updateFormFlow() {
        const type = document.getElementById("work-type").value;
        document.getElementById("hajira-fields").className = (type === "হাজিরা") ? "" : "hidden";
        document.getElementById("dynamic-flow").className = (type !== "") ? "" : "hidden";
        document.getElementById("amount").readOnly = (type === "হাজিরা");
        if(type !== "হাজিরা") document.getElementById("amount").value = "";
    }

    function calculateHajiraAmount() {
        const hours = parseInt(document.getElementById("work-hours").value);
        let mult = 0;
        if(hours === 4) mult = 0.5; if(hours === 8) mult = 1.0; if(hours === 12) mult = 1.5;
        document.getElementById("amount").value = mult * parseFloat(activeUser.hajira_rate || 0);
    }

    function submitReport(e) {
        e.preventDefault();
        const d = new Date();
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        
        let hc = 0; const hours = parseInt(document.getElementById("work-hours").value || 0);
        if(hours === 4) hc = 0.5; if(hours === 8) hc = 1; if(hours === 12) hc = 1.5;

        const newReport = {
          "id": "REP_" + d.getTime(),
          "username": activeUser.username,
          "date": d.getDate() + "-" + months[d.getMonth()] + "-" + d.getFullYear(),
          "time": d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
          "report_type": document.getElementById("work-type").value,
          "details": `${activeUser.title} -> ${document.getElementById("furniture-item").value}`,
          "amount": parseFloat(document.getElementById("amount").value || 0),
          "paid_amount": 0,
          "hajira_count": hc,
          "image_path": document.getElementById("photo-link").value || "No Image",
          "status": "Pending"
        };

        let localLedger = JSON.parse(localStorage.getItem('local_ledger') || '[]');
        localLedger.push(newReport);
        localStorage.setItem('local_ledger', JSON.stringify(localLedger));

        alert("✅ হিসাবটি মালিকের অ্যাডমিন প্যানেলে পাঠানো হয়েছে! মালিক অ্যাপ্রুভ করার জন্য অপেক্ষা করুন।");
        location.reload();
    }
</script>
</body>
</html>
