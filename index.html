<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিল বা মেমো রিপোর্ট ফরম</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .form-container { max-width: 450px; background: #fff; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1a365d; margin-bottom: 25px; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #4a5568; font-size: 14px; }
        select, input[type="number"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        select:disabled { background-color: #edf2f7; cursor: not-allowed; }
        .btn-submit { width: 100%; padding: 14px; background-color: #00c292; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-back { width: 100%; padding: 12px; background-color: #5c677d; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>📝 বিল বা মেমো রিপোর্ট ফরম</h2>
    <form id="reportForm">
        <div class="form-group">
            <label>রিপোর্টের ধরণ সিলেক্ট করুন</label>
            <select id="workType" required onchange="updateMistriOptions()">
                <option value="">-- সিলেক্ট করুন --</option>
                <option value="হাজিরা">হাজিরা</option>
                <option value="কন্ট্রাক্ট">কন্ট্রাক্ট</option>
            </select>
        </div>

        <div class="form-group">
            <label>মিস্ত্রি বা দোকানের ধরণ</label>
            <select id="mistriType" required disabled onchange="updateProductOptions()">
                <option value="">-- আগে রিপোর্টের ধরণ সিলেক্ট করুন --</option>
            </select>
        </div>

        <div class="form-group">
            <label>কাজের বিবরণ বা প্রোডাক্ট</label>
            <select id="productDetail" required disabled>
                <option value="">-- আগে মিস্ত্রি সিলেক্ট করুন --</option>
            </select>
        </div>

        <div class="form-group">
            <label>মেমো বা ফটো আপলোড করুন (ছবি বাধ্যতামূলক নয়)</label>
            <input type="file" id="fileUpload" accept="image/*">
        </div>

        <div class="form-group">
            <label>টাকার পরিমাণ (অংক লিখুন)</label>
            <input type="number" id="amount" placeholder="উদা: 5000" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">এডমিন প্যানেলে পাঠান</button>
        <button type="button" class="btn-back" onclick="history.back()">পিছনে যান</button>
    </form>
</div>

<script>
const mistriOptions = ["কালার মিস্ত্রি", "নকশা মিস্ত্রি", "কাঠমিস্ত্রি", "CNC দোকান"];
const productOptions = ["অফিস টেবিল", "আলমিরা", "ড্রেসিং টেবিল", "জুতার বাক্স", "티브ির বক্স", "ওয়ারড্রব", "শোকেস", "খাট"];

function updateMistriOptions() {
    const workType = document.getElementById("workType").value;
    const mistriType = document.getElementById("mistriType");
    const productDetail = document.getElementById("productDetail");
    mistriType.innerHTML = '<option value="">-- সিলেক্ট করুন --</option>';
    productDetail.innerHTML = '<option value="">-- আগে মিস্ত্রি সিলেক্ট করুন --</option>';
    productDetail.disabled = true;

    if (workType) {
        mistriType.disabled = false;
        mistriOptions.forEach(opt => {
            let o = document.createElement("option"); o.value = opt; o.textContent = opt; mistriType.appendChild(o);
        });
    } else { mistriType.disabled = true; }
}

function updateProductOptions() {
    const mistriType = document.getElementById("mistriType").value;
    const productDetail = document.getElementById("productDetail");
    productDetail.innerHTML = '<option value="">-- সিলেক্ট করুন --</option>';

    if (mistriType) {
        productDetail.disabled = false;
        productOptions.forEach(opt => {
            let o = document.createElement("option"); o.value = opt; o.textContent = opt; productDetail.appendChild(o);
        });
    } else { productDetail.disabled = true; }
}

document.getElementById("reportForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    btn.innerText = "পাঠানো হচ্ছে..."; btn.disabled = true;

    const file = document.getElementById("fileUpload").files[0];
    if (file) {
        const reader = new FileReader();
        reader.onloadend = function() {
            sendData(reader.result.split(',')[1], file.name, file.type);
        };
        reader.readAsDataURL(file);
    } else { sendData("", "", ""); }
});

function sendData(base64, fileName, mimeType) {
    const scriptUrl = "https://script.google.com/macros/s/AKfycbx7Fym_Dt5Aq7jV2CzuiKlW4IEWo65sx19CAvBY2YVv4HRwIbkL_-d8EdSiBciGdNWHCQ/exec";
    
    const formData = {
        action: "submit",
        workType: document.getElementById("workType").value,
        mistriType: document.getElementById("mistriType").value,
        productDetail: document.getElementById("productDetail").value,
        amount: document.getElementById("amount").value,
        fileData: base64, fileName: fileName, mimeType: mimeType,
        user: "DIDAR" 
    };

    fetch(scriptUrl, { method: "POST", body: JSON.stringify(formData) })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if(data.status === "success") {
            document.getElementById("reportForm").reset();
            updateMistriOptions();
        }
    })
    .catch(() => alert("নেটওয়ার্ক এরর! আবার চেষ্টা করুন।"))
    .finally(() => {
        document.getElementById("submitBtn").innerText = "এডমিন প্যানেলে পাঠান";
        document.getElementById("submitBtn").disabled = false;
    });
}
</script>
</body>
</html>
