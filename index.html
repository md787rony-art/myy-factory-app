<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কারখানা মিস্ত্রি ড্যাশবোর্ড</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #3498db; }
        button { width: 100%; padding: 12px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2980b9; }
        .hidden { display: none; }
        .dashboard-header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .stats { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat-box { flex: 1; background: #f8f9fa; padding: 12px; border-radius: 8px; text-align: center; border-top: 4px solid #2ecc71; }
        .stat-box.due { border-top-color: #e74c3c; }
        .stat-box h3 { font-size: 18px; color: #2c3e50; margin-top: 5px; }
        .history-list { margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .history-item { background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #3498db; font-size: 13px; }
        .logout-btn { background: #e74c3c; margin-top: 15px; }
        .logout-btn:hover { background: #c0392b; }
        .loading { text-align: center; color: #7f8c8d; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- ১. লগইন স্ক্রিন -->
    <div id="login-box">
        <h2>🏭 মিস্ত্রি লগইন প্যানেল</h2>
        <div class="form-group">
            <label>মিস্ত্রির নাম (ছোট হাতের অক্ষরে)</label>
            <input type="text" id="username" placeholder="যেমন: username">
        </div>
        <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="password" placeholder="যেমন: password">
        </div>
        <button onclick="login()">লগইন করুন</button>
        <div id="login-error" style="color:red; text-align:center; margin-top:10px; font-weight:bold;"></div>
    </div>

    <!-- ২. মিস্ত্রি ড্যাশবোর্ড স্ক্রিন -->
    <div id="dashboard-box" class="hidden">
        <div class="dashboard-header">
            <h3 id="user-welcome">স্বাগতম, মিস্ত্রি!</h3>
            <p id="user-type" style="font-size:12px; opacity:0.8;"></p>
        </div>

        <!-- জমা-খরচের সংক্ষিপ্ত হিসাব -->
        <div class="stats">
            <div class="stat-box">
                <p style="font-size: 12px; color:#7f8c8d;">মোট কামাই</p>
                <h3 id="stat-earned">0 ৳</h3>
            </div>
            <div class="stat-box due">
                <p style="font-size: 12px; color:#7f8c8d;">মোট নিয়েছেন</p>
                <h3 id="stat-paid">0 ৳</h3>
            </div>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <!-- নতুন কাজের রিপোর্ট বা মেমো জমার ফর্ম -->
        <h3>📝 কাজের রিপোর্ট / মেমো জমা দিন</h3>
        <div id="msg" style="color:green; font-weight:bold; text-align:center; margin: 5px 0;"></div>
        
        <div class="form-group" style="margin-top:10px;">
            <label>রিপোর্টের ধরন</label>
            <select id="reportType">
                <option value="Work_Report">কাজের রিপোর্ট (মজুরি দাবি)</option>
                <option value="Memo">বাজারের মেমো (খরচের বিল)</option>
            </select>
        </div>
        <div class="form-group">
            <label>কাজের বিবরণ / মালের নাম</label>
            <textarea id="details" rows="3" placeholder="যেমন: ওফিসিয়াল টেবিল তৈরি কমপ্লিট বা বাজারের কাঠের রসিদ"></textarea>
        </div>
        <div class="form-group">
            <label>টাকার পরিমাণ (মজুরি বা বিলের মোট টাকা)</label>
            <input type="number" id="amount" placeholder="যেমন: 3500">
        </div>
        <button id="submit-btn" onclick="submitReport()">জমা দিন (Submit)</button>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <!-- কাজের ইতিহাস বা লেজার -->
        <h3>🕒 আপনার আগের কাজের খতিয়ান</h3>
        <div class="history-list" id="history-container">
            <!-- ডাটা অটোমেটিক লোড হবে -->
        </div>

        <button class="logout-btn" onclick="logout()">লগআউট করুন</button>
    </div>
</div>

<script>
    // 🔗 আপনার সরবরাহকৃত গুগল অ্যাপস স্ক্রিপ্ট ওয়েব অ্যাপ লিংক
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxMONz92JbPF8OrB1e4DjgLfUFhSQQ2rt6uNBsxNTtjdci3fLnZDwvqYEJMbp8FcgpZ0Q/exec";
    
    let currentUser = null;

    // লগইন ফাংশন
    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const err = document.getElementById('login-error');
        
        if(!u || !p) { err.innerText = "নাম ও পাসওয়ার্ড দুটিই দিন!"; return; }
        err.innerText = "যাচাই করা হচ্ছে, দয়া করে অপেক্ষা করুন...";

        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "login", username: u, password: p })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "SUCCESS") {
                err.innerText = "";
                currentUser = data;
                showDashboard();
            } else {
                err.innerText = "ভুল নাম অথবা পাসওয়ার্ড! আবার চেষ্টা করুন।";
            }
        })
        .catch(e => { err.innerText = "নেটওয়ার্ক সমস্যা! আবার ট্রাই করুন।"; });
    }

    // ড্যাশবোর্ড স্ক্রিন দেখানো ও ডাটা বসানো
    function showDashboard() {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('dashboard-box').classList.remove('hidden');
        
        document.getElementById('user-welcome').innerText = "👤 " + currentUser.name.toUpperCase();
        document.getElementById('user-type').innerText = "ধরণ: " + (currentUser.type === "Contract" ? "কন্টাক্টদার মিস্ত্রি" : "হাজিরা মিস্ত্রি");
        document.getElementById('stat-earned').innerText = currentUser.totalEarned + " ৳";
        document.getElementById('stat-paid').innerText = currentUser.totalPaid + " ৳";

        // ইতিহাস সাজানো
        const histContainer = document.getElementById('history-container');
        histContainer.innerHTML = "";
        if(currentUser.history.length === 0) {
            histContainer.innerHTML = "<p style='color:#999;font-size:12px;'>এখনো কোনো অনুমোদিত হিসাব নেই।</p>";
        } else {
            currentUser.history.reverse().forEach(item => {
                let dateStr = new Date(item.date).toLocaleDateString('bn-BD');
                let typeBadge = item.type === "Advance" ? "খরচ/অগ্রিম" : "কামাই/মজুরি";
                let tColor = item.type === "Advance" ? "red" : "green";
                histContainer.innerHTML += `
                    <div class="history-item">
                        <strong>📅 তারিখ:</strong> ${dateStr} | <span style="color:${tColor}; font-weight:bold;">${typeBadge}</span><br>
                        <strong>📝 বিবরণ:</strong> ${item.details}<br>
                        <strong>💰 টাকা:</strong> ${item.earned > 0 ? item.earned : item.paid} ৳
                    </div>`;
            });
        }
    }

    // রিপোর্ট/মেমো সাবমিট ফাংশন
    function submitReport() {
        const type = document.getElementById('reportType').value;
        const details = document.getElementById('details').value.trim();
        const amount = document.getElementById('amount').value.trim();
        const msg = document.getElementById('msg');
        const sBtn = document.getElementById('submit-btn');

        if(!details || !amount) { alert("সবগুলো ঘর সঠিকভাবে পূরণ করুন!"); return; }

        sBtn.disabled = true;
        sBtn.innerText = "পাঠানো হচ্ছে...";
        msg.innerText = "";

        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "submit_report",
                name: currentUser.name,
                reportType: type,
                details: details,
                amount: amount
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "SUCCESS") {
                msg.style.color = "green";
                msg.innerText = "✅ সফলভাবে এডমিনের কাছে পাঠানো হয়েছে! অনুমোদনের জন্য অপেক্ষা করুন।";
                document.getElementById('details').value = "";
                document.getElementById('amount').value = "";
            } else {
                msg.style.color = "red";
                msg.innerText = "❌ জমা হয়নি, আবার চেষ্টা করুন।";
            }
            sBtn.disabled = false;
            sBtn.innerText = "জমা দিন (Submit)";
        })
        .catch(e => {
            msg.style.color = "red";
            msg.innerText = "নেটওয়ার্ক ত্রুটি!";
            sBtn.disabled = false;
            sBtn.innerText = "জমা দিন (Submit)";
        });
    }

    // লগআউট ফাংশন
    function logout() {
        currentUser = null;
        document.getElementById('username').value = "";
        document.getElementById('password').value = "";
        document.getElementById('dashboard-box').classList.add('hidden');
        document.getElementById('login-box').classList.remove('hidden');
    }
</script>

</body>
</html>
