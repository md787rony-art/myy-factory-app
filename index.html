<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কারখানা মিস্ত্রি ও মালিক পোর্টাল</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: linear-gradient(135deg, #fbcfe8 0%, #e2e8f0 100%); color: #000; padding: 15px; min-height: 100vh; }
        .box-3d { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15), inset 0 -4px 0 rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.8); margin-bottom: 20px; }
        h2, h3 { color: #000; margin-bottom: 15px; }
        .login-screen { max-width: 400px; margin: 60px auto; text-align: center; }
        .dashboard, .admin-panel { display: none; max-width: 700px; margin: 0 auto; }
        input, select { width: 100%; padding: 12px; margin: 10px 0 18px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; background: #f8fafc; color: #000; font-weight: 500; }
        button { width: 100%; padding: 14px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button:active { transform: translateY(2px); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .stat-card { background: #000; padding: 15px; border-radius: 10px; text-align: center; color: #fff; }
        .stat-card h4 { font-size: 14px; color: #ccc; }
        .stat-card p { font-size: 22px; font-weight: bold; margin-top: 5px; }
        .stat-card.balance-card { background: #fff; color: #000; border: 2px solid #000; }
        .hidden { display: none; }
        .history-item { padding: 12px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 15px; color: #000; }
        .user-meta-info { margin-top: 8px; font-size: 14px; color: #555; background: #f1f5f9; padding: 10px; border-radius: 8px; border-left: 4px solid #000; }
        .logout-btn { background: #dc2626; margin-top: 10px; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>

<!-- 🔒 লগইন স্ক্রিন (মিস্ত্রি ও মালিক উভয়ের জন্য) -->
<div id="login-block" class="box-3d login-screen">
    <h2>🏭 কারখানা পোর্টাল লগইন</h2>
    <input type="text" id="username" placeholder="ইউজারনেম দিন">
    <input type="password" id="password" placeholder="পাসওয়ার্ড দিন">
    <button onclick="handleLogin()">🔐 একাউন্টে প্রবেশ করুন</button>
</div>

<!-- ================= 👑 মালিকের অ্যাডমিন প্যানেল ================= -->
<div id="admin-block" class="admin-panel">
    <div class="box-3d" style="border-left: 6px solid #ef4444;">
        <h2>👑 মালিকের অ্যাডমিন কন্ট্রোল প্যানেল</h2>
        <p>এখান থেকে মিস্ত্রিদের কাজ, হাজিরা এবং টাকা লেনদেনের হিসাব ইনপুট দিন।</p>
        <hr style="margin: 15px 0;">
        
        <label><b>১. মিস্ত্রি বাছাই করুন:</b></label>
        <select id="admin-select-mistry">
            <option value="rony">রনি (প্রধান মিস্ত্রি)</option>
            <option value="kamal">কামাল (সহকারী মিস্ত্রি)</option>
            <option value="alamin">আলামিন (ফিটিং মিস্ত্রি)</option>
            <option value="babul">বাবুল (কালার মিস্ত্রি)</option>
        </select>

        <label><b>২. এন্ট্রি টাইপ:</b></label>
        <select id="admin-entry-type" onchange="toggleAdminFields()">
            <option value="काम">কাজের বিল যোগ করুন (পাওনা)</option>
            <option value="টাকা">টাকা প্রদান বা অগ্রিম (দেনা)</option>
            <option value="হাজিরা">শুধু হাজিরা কাউন্ট যোগ করুন</option>
        </select>

        <div id="admin-amount-section">
            <label><b>৩. টাকার পরিমাণ (৳):</b></label>
            <input type="number" id="admin-amount" placeholder="টাকার অংক লিখুন">
        </div>

        <label><b>৪. কাজের বিবরণ / নোট:</b></label>
        <input type="text" id="admin-details" placeholder="উদা: ২টা খাট তৈরি / বা অগ্রিম দেয়া হলো">

        <button onclick="saveDataByAdmin()" style="background: #16a34a;">💾 হিসাব সেভ করুন</button>
        <button onclick="location.reload()" class="logout-btn">📴 লগআউট করুন</button>
    </div>
</div>

<!-- ================= 👤 মিস্ত্রি ড্যাশবোর্ড প্রোফাইল ================= -->
<div id="dashboard-block" class="dashboard">
    <div class="box-3d">
        <h3 id="user-welcome">👤 স্বাগতম মিস্ত্রি</h3>
        <div id="user-details-box" class="user-meta-info"></div>
        <br>
        <div class="stats-grid">
            <div class="stat-card"><h4>মোট হাজিরা</h4><p id="stat-hajira">0</p></div>
            <div class="stat-card"><h4>মোট বিল (পাওনা)</h4><p id="stat-earned">0 ৳</p></div>
            <div class="stat-card"><h4>মোট গ্রহণ (দেনা)</h4><p id="stat-paid">0 ৳</p></div>
            <div class="stat-card balance-card"><h4>নিট বকেয়া</h4><p id="stat-balance">0 ৳</p></div>
        </div>
        <button onclick="location.reload()" class="logout-btn">📴 লগআউট করুন</button>
    </div>

    <!-- কাজের বিবরণ ও মেমো জমা দেওয়ার ফর্ম -->
    <div class="box-3d">
        <h3>📝 নতুন কাজের বিবরণ ও মেমো জমা দিন</h3>
        <form id="reportForm" onsubmit="submitReport(event)">
            <label><b>কাজের ধরণ</b></label>
            <select id="work-type" onchange="updateFormFlow()" required>
                <option value="">--বাছাই করুন--</option>
                <option value="হাজিরা">হাজিরা ভিত্তিক কাজ</option>
                <option value="কন্ট্রাক্ট">কন্ট্রাক্ট ভিত্তিক কাজ</option>
            </select>

            <div id="hajira-fields" class="hidden">
                <label><b>কয় ঘণ্টা কাজ করেছেন?</b></label>
                <select id="work-hours" onchange="calculateHajiraAmount()">
                    <option value="0">--ঘণ্টা সিলেক্ট করুন--</option>
                    <option value="4">৪ ঘণ্টা (আধা হাজিরা)</option>
                    <option value="8">৮ ঘণ্টা (এক হাজিরা)</option>
                    <option value="12">১২ ঘণ্টা (দের হাজিরা)</option>
                </select>
            </div>

            <div id="dynamic-flow" class="hidden">
                <label><b>নির্দিষ্ট কাজের আইটেম</b></label>
                <select id="furniture-item" required>
                    <option value="অফিস টেবিল">অফিস টেবিল কাটিং/তৈরি</option>
                    <option value="আলমিরা">আলমিরা ফিটিং/কালার</option>
                    <option value="ড্রেসিং টেবিল">ড্রেসিং টেবিল নকশা</option>
                    <option value="খাট">খাট তৈরি</option>
                </select>

                <label><b>টাকার পরিমাণ (৳)</b></label>
                <input type="number" id="amount" placeholder="টাকার অংক">
                
                <label><b>📸 মেমো বা ছবির লিংক</b></label>
                <input type="text" id="photo-link" placeholder="লিংক দিন">
                
                <button type="submit" style="background: #000;">📤 মালিকের কাছে পাঠান</button>
            </div>
        </form>
    </div>

    <!-- মিস্ত্রির কাজের নিজস্ব ইতিহাস খাতা -->
    <div class="box-3d">
        <h3>📊 আপনার নিজস্ব কাজের খাতা ও ইতিহাস</h3>
        <div id="history-list"></div>
    </div>
</div>

<script>
    // 🔐 মিস্ত্রিদের স্থায়ী প্রোফাইল ডাটাবেস
    const MISTRY_DB = [
        { username: "rony", password: "123", title: "প্রধান মিস্ত্রি", mobile: "01712345678", hajira_rate: 500 },
        { username: "kamal", password: "123", title: "সহকারী মিস্ত্রি", mobile: "01822222222", hajira_rate: 400 },
        { username: "alamin", password: "456", title: "ফিটিং মিস্ত্রি", mobile: "01933333333", hajira_rate: 450 },
        { username: "babul", password: "789", title: "কালার মিস্ত্রি", mobile: "01544444444", hajira_rate: 400 }
    ];

    let activeUser = {};

    // ১. লগইন কন্ট্রোল লজিক (মালিক ও মিস্ত্রি আলাদা করার উপায়)
    function handleLogin() {
        const inputUser = document.getElementById("username").value.trim().toLowerCase();
        const inputPass = document.getElementById("password").value;

        if (!inputUser || !inputPass) {
            return alert("ইউজারনেম এবং পাসওয়ার্ড দিন!");
        }

        // 👑 মালিকের জন্য ফিক্সড লগইন চেক
        if (inputUser === "admin" && inputPass === "admin123") {
            document.getElementById("login-block").style.display = "none";
            document.getElementById("admin-block").style.display = "block";
            return;
        }

        // 👤 মিস্ত্রিদের জন্য লগইন চেক
        const user = MISTRY_DB.find(u => u.username === inputUser && u.password === inputPass);
        if (user) {
            activeUser = user;
            loadMistryDashboard();
        } else {
            alert("❌ ভুল ইউজারনেম বা পাসওয়ার্ড!");
        }
    }

    // ২. অ্যাডমিন প্যানেলের ইনপুট কন্ট্রোল
    function toggleAdminFields() {
        const type = document.getElementById("admin-entry-type").value;
        document.getElementById("admin-amount-section").style.display = (type === "হাজিরা") ? "none" : "block";
    }

    // 👑 ৩. মালিকের দেওয়া ডাটা লোকাল ডেটাবেজে সেভ করার ফাংশন
    function saveDataByAdmin() {
        const targetMistry = document.getElementById("admin-select-mistry").value;
        const entryType = document.getElementById("admin-entry-type").value;
        const amount = parseFloat(document.getElementById("admin-amount").value || 0);
        const details = document.getElementById("admin-details").value.trim();

        if (entryType !== "হাজিরা" && !amount) {
            return alert("টাকার পরিমাণ লিখুন!");
        }
        if (!details) return alert("কাজের একটি বিবরণ বা নোট লিখুন!");

        // লোকাল স্টোরেজ থেকে আগের জমানো হিসাবের খাতা তুলে আনা
        let factoryDB = JSON.parse(localStorage.getItem('factory_main_db') || '{}');
        
        if (!factoryDB[targetMistry]) {
            factoryDB[targetMistry] = { total_hajira: 0, total_earned: 0, total_paid: 0, ledger: [] };
        }

        const d = new Date();
        const dateStr = d.getDate() + "-" + d.toLocaleString('en-US', { month: 'short' }) + "-" + d.getFullYear();
        const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // হিসাব ক্যালকুলেশন লজিক
        if (entryType === "काम") {
            factoryDB[targetMistry].total_earned += amount;
            factoryDB[targetMistry].ledger.push({ date: dateStr, time: timeStr, details: details, amount: `+${amount}` });
        } else if (entryType === "টাকা") {
            factoryDB[targetMistry].total_paid += amount;
            factoryDB[targetMistry].ledger.push({ date: dateStr, time: timeStr, details: `💸 ${details}`, amount: `-${amount}` });
        } else if (entryType === "হাজিরা") {
            factoryDB[targetMistry].total_hajira += 1;
            // হাজিরার টাকা অটোমেটিক রেট অনুযায়ী যোগ হবে
            const rate = MISTRY_DB.find(m => m.username === targetMistry).hajira_rate;
            factoryDB[targetMistry].total_earned += rate;
            factoryDB[targetMistry].ledger.push({ date: dateStr, time: timeStr, details: `🪵 হাজিরা কাউন্ট: ${details}`, amount: `+${rate}` });
        }

        // ডেটা পার্মানেন্টলি ব্রাউজার মেমোরিতে সেভ
        localStorage.setItem('factory_main_db', JSON.stringify(factoryDB));
        alert("✅ হিসাব সফলভাবে সেভ হয়েছে!");
        
        // ইনপুট রিসেট
        document.getElementById("admin-amount").value = "";
        document.getElementById("admin-details").value = "";
    }

    // ৪. মিস্ত্রিদের নিজস্ব ড্যাশবোর্ড ও হিসাব খাতা রেন্ডার করার ফাংশন
    function loadMistryDashboard() {
        document.getElementById("login-block").style.display = "none";
        document.getElementById("dashboard-block").style.display = "block";

        document.getElementById("user-welcome").innerText = `👤 স্বাগতম, ${activeUser.username.toUpperCase()}`;
        document.getElementById("user-details-box").innerHTML = `
            <strong>আপনার পদবি:</strong> ${activeUser.title} <br>
            <strong>নিবন্ধিত মোবাইল:</strong> ${activeUser.mobile} <br>
            <strong>ডেইলি হাজিরা রেট:</strong> ${activeUser.hajira_rate} ৳
        `;

        // লোকাল ডেটাবেজ থেকে এই মিস্ত্রির হিসাব ফিল্টার করা
        let factoryDB = JSON.parse(localStorage.getItem('factory_main_db') || '{}');
        let myData = factoryDB[activeUser.username] || { total_hajira: 0, total_earned: 0, total_paid: 0, ledger: [] };

        // ড্যাশবোর্ডে মানগুলো বসানো
        document.getElementById("stat-hajira").innerText = myData.total_hajira;
        document.getElementById("stat-earned").innerText = myData.total_earned + " ৳";
        document.getElementById("stat-paid").innerText = myData.total_paid + " ৳";
        document.getElementById("stat-balance").innerText = (myData.total_earned - myData.total_paid) + " ৳";

        // কাজের হিস্ট্রি লিস্ট তৈরি
        const histContainer = document.getElementById("history-list");
        histContainer.innerHTML = "";
        
        if(myData.ledger.length > 0) {
            myData.ledger.forEach(h => {
                histContainer.innerHTML += `<div class="history-item"><span>📅 ${h.date} - ${h.details} (${h.time})</span><strong>${h.amount} ৳</strong></div>`;
            });
        } else {
            histContainer.innerHTML = "<p>আপনার নিজস্ব কোনো পূর্ববর্তী কাজের ইতিহাস পাওয়া যায়নি।</p>";
        }
    }

    // ফরমের অন্যান্য সাধারণ ফাংশনাবলি
    function updateFormFlow() {
        const type = document.getElementById("work-type").value;
        document.getElementById("hajira-fields").className = (type === "হাজিরা") ? "" : "hidden";
        document.getElementById("dynamic-flow").className = (type !== "") ? "" : "hidden";
        document.getElementById("amount").readOnly = (type === "হাজিরা");
        if(type === "হাজিরা") calculateHajiraAmount();
    }

    function calculateHajiraAmount() {
        const hours = parseInt(document.getElementById("work-hours").value || 8);
        let mult = 1.0;
        if(hours === 4) mult = 0.5; if(hours === 12) mult = 1.5;
        document.getElementById("amount").value = mult * parseFloat(activeUser.hajira_rate || 0);
    }

    function submitReport(e) {
        e.preventDefault();
        alert("✅ আপনার কাজের বিবরণ সফলভাবে পাঠানো হয়েছে! মালিকের এপ্রুভালের পর এটি আপনার খাতায় যোগ হবে।");
        location.reload();
    }
</script>
</body>
</html>
