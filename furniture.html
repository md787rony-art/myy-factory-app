<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডভান্সড কারখানা কস্টিং ক্যালকুলেটর</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f4f8; padding: 25px 15px; color: #333; }
        .main-container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
        .box { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { font-size: 1.3rem; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #3498db; color: #2c3e50; }
        h3 { font-size: 1.1rem; color: #2c3e50; margin-bottom: 10px; background: #e8f4fd; padding: 6px; border-left: 4px solid #3498db; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { font-size: 0.9rem; margin-bottom: 4px; font-weight: 600; color: #555; }
        input[type="number"] { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        input[type="number"]:focus { border-color: #3498db; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-save { background-color: #e67e22; color: white; margin-top: 10px; }
        .btn-save:hover { background-color: #d35400; }
        .btn-calc { background-color: #27ae60; color: white; margin-top: 15px; font-size: 1.2rem; }
        .btn-calc:hover { background-color: #219653; }
        .result-box { margin-top: 20px; background: #2c3e50; color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .result-box h4 { font-weight: normal; margin-bottom: 5px; opacity: 0.9; }
        .total-amount { font-size: 2.2rem; font-weight: bold; color: #2ecc71; }
        .notice { font-size: 0.8rem; color: #7f8c8d; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

<h1 style="text-align: center; margin-bottom: 25px; color: #2c3e50; font-size: 1.8rem;">📐 প্রোডাকশন কস্টিং ম্যানেজার</h1>

<div class="main-container">
    
    <div class="box" style="border-top: 4px solid #e67e22;">
        <h2>⚙️ মালের রেট সেটিংস (১ বার সেভ করুন)</h2>
        <form id="settingsForm" onsubmit="saveRates(event)">
            <h3>বোর্ডের প্রতি পিসের দাম</h3>
            <div class="form-group">
                <label>১৮ মিমি MDF রেট (টাকা)</label>
                <input type="number" id="cfg_18mm" value="1790" required>
            </div>
            <div class="form-group">
                <label>১৫ মিমি MDF রেট (টাকা)</label>
                <input type="number" id="cfg_15mm" value="1580" required>
            </div>
            <div class="form-group">
                <label>৬ মিমি প্লাই/বোর্ড রেট (টাকা)</label>
                <input type="number" id="cfg_6mm" value="1300" required>
            </div>

            <h3>হার্ডওয়্যার রেট</h3>
            <div class="form-group">
                <label>প্রতিটি হ্যান্ডেল রেট (টাকা)</label>
                <input type="number" id="cfg_handle" value="440" required>
            </div>
            <div class="form-group">
                <label>১৪" ড্রয়ার চ্যানেল (প্রতি সেট রেট)</label>
                <input type="number" id="cfg_channel" value="200" required>
            </div>

            <button type="submit" class="btn-save">💾 রেট আপডেট ও সেভ করুন</button>
            <p class="notice">*একবার সেভ করলে ব্রাউজার এটি আজীবন মনে রাখবে।</p>
        </form>
    </div>

    <div class="box" style="border-top: 4px solid #27ae60;">
        <h2>📝 দৈনিক মালের পরিমাণ ও হিসাব</h2>
        <form id="calcForm" onsubmit="calculateTotal(event)">
            <h3>মালামালের পরিমাণ (পিস/সেট)</h3>
            <div class="form-group">
                <label>১৮ মিমি MDF লেগেছে (পিস)</label>
                <input type="number" id="qty_18mm" value="0" min="0" step="any">
            </div>
            <div class="form-group">
                <label>১৫ মিমি MDF লেগেছে (পিস)</label>
                <input type="number" id="qty_15mm" value="0" min="0" step="any">
            </div>
            <div class="form-group">
                <label>৬ মিমি প্লাই লেগেছে (পিস)</label>
                <input type="number" id="qty_6mm" value="0" min="0" step="any">
            </div>
            <div class="form-group">
                <label>হ্যান্ডেল লেগেছে (টি)</label>
                <input type="number" id="qty_handle" value="0" min="0">
            </div>
            <div class="form-group">
                <label>১৪" ড্রয়ার চ্যানেল লেগেছে (সেট)</label>
                <input type="number" id="qty_channel" value="0" min="0">
            </div>

            <h3>অন্যান্য সরাসরি খরচ (টাকা)</h3>
            <div class="form-group">
                <label>লেকার / কালার মালামালের বিল (যেমন ভাউচারের ১৩,৪০০)</label>
                <input type="number" id="cost_lacquer" value="0" min="0">
            </div>
            <div class="form-group">
                <label>অন্যান্য খুচরা মাল (স্ক্রু, গ্লু, টেপ, গজ ইত্যাদি মোট টাকা)</label>
                <input type="number" id="cost_others" value="0" min="0">
            </div>
            <div class="form-group">
                <label>মিস্ত্রি মজুরি / লেবার বিল (টাকা)</label>
                <input type="number" id="cost_labor" value="0" min="0">
            </div>

            <button type="submit" class="btn-calc">📊 মোট উৎপাদন খরচ বের করুন</button>
        </form>

        <div class="result-box">
            <h4>সর্বমোট উৎপাদন খরচ (Total Cost):</h4>
            <div class="total-amount" id="grandTotal">০.০০ টাকা</div>
        </div>
    </div>

</div>

<script>
    // পেজ লোড হওয়ার সময় আগের সেভ করা রেটগুলো লোড করার লজিক
    window.onload = function() {
        if(localStorage.getItem('cfg_18mm')) {
            document.getElementById('cfg_18mm').value = localStorage.getItem('cfg_18mm');
            document.getElementById('cfg_15mm').value = localStorage.getItem('cfg_15mm');
            document.getElementById('cfg_6mm').value = localStorage.getItem('cfg_6mm');
            document.getElementById('cfg_handle').value = localStorage.getItem('cfg_handle');
            document.getElementById('cfg_channel').value = localStorage.getItem('cfg_channel');
        }
    }

    // রেট সেভ করার ফাংশন
    function saveRates(event) {
        event.preventDefault();
        localStorage.setItem('cfg_18mm', document.getElementById('cfg_18mm').value);
        localStorage.setItem('cfg_15mm', document.getElementById('cfg_15mm').value);
        localStorage.setItem('cfg_6mm', document.getElementById('cfg_6mm').value);
        localStorage.setItem('cfg_handle', document.getElementById('cfg_handle').value);
        localStorage.setItem('cfg_channel', document.getElementById('cfg_channel').value);
        alert('অভিনন্দন! নতুন রেটগুলো সফলভাবে সেভ হয়েছে।');
    }

    // চূড়ান্ত হিসাব করার ফাংশন
    function calculateTotal(event) {
        event.preventDefault();

        // বর্তমান সেভ থাকা রেটগুলো নেওয়া
        let r18 = parseFloat(document.getElementById('cfg_18mm').value) || 0;
        let r15 = parseFloat(document.getElementById('cfg_15mm').value) || 0;
        let r6  = parseFloat(document.getElementById('cfg_6mm').value) || 0;
        let rHand = parseFloat(document.getElementById('cfg_handle').value) || 0;
        let rChan = parseFloat(document.getElementById('cfg_channel').value) || 0;

        // আজকের মালের পরিমাণ নেওয়া
        let q18 = parseFloat(document.getElementById('qty_18mm').value) || 0;
        let q15 = parseFloat(document.getElementById('qty_15mm').value) || 0;
        let q6  = parseFloat(document.getElementById('qty_6mm').value) || 0;
        let qHand = parseFloat(document.getElementById('qty_handle').value) || 0;
        let qChan = parseFloat(document.getElementById('qty_channel').value) || 0;

        // অন্যান্য সরাসরি খরচ নেওয়া
        let cLacquer = parseFloat(document.getElementById('cost_lacquer').value) || 0;
        let cOthers  = parseFloat(document.getElementById('cost_others').value) || 0;
        let cLabor   = parseFloat(document.getElementById('cost_labor').value) || 0;

        // হিসাব নিকাশ
        let totalBoardCost = (q18 * r18) + (q15 * r15) + (q6 * r6);
        let totalHardware = (qHand * rHand) + (qChan * rChan);
        let grandTotal = totalBoardCost + totalHardware + cLacquer + cOthers + cLabor;

        // স্ক্রিনে সুন্দর করে আউটপুট দেখানো
        document.getElementById('grandTotal').innerText = grandTotal.toFixed(2) + " টাকা";
    }
</script>

</body>
</html>
