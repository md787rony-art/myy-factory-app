<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সহজ বাজার - অ্যাডমিন কন্ট্রোল</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding: 15px; }
        
        .admin-container { max-width: 650px; margin: 0 auto; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ddd; }
        .admin-header { background: #1b5e20; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        
        .product-item { background: #f9f9f9; border: 1px solid #c8e6c9; border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; color: #2e7d32; margin-bottom: 5px; }
        .input-group input, .input-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        
        .preview-img { width: 90px; height: 90px; object-fit: cover; border-radius: 5px; margin-top: 5px; border: 1px solid #ccc; display: block; }
        .upload-status { font-size: 13px; font-weight: bold; margin-top: 5px; margin-bottom: 5px; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .add-btn { background: #2e7d32; color: white; padding: 12px; border: none; border-radius: 5px; flex: 1; cursor: pointer; font-weight: bold; font-size: 14px; }
        .save-btn { background: #ff9800; color: white; padding: 12px; border: none; border-radius: 5px; flex: 2; cursor: pointer; font-weight: bold; font-size: 14px; }
        .delete-btn { background: #d32f2f; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; float: right; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">⚙️ সহজ বাজার - অ্যাডমিন প্যানেল</div>
        
        <div id="productList">
            <p style="text-align:center;">ডাটা লোড হচ্ছে...</p>
        </div>

        <div class="btn-group">
            <button class="add-btn" onclick="addNewProduct()">➕ নতুন পণ্য যোগ করুন</button>
            <button class="save-btn" onclick="saveData()">💾 সাইটে আপডেট সেভ করুন</button>
        </div>
    </div>

    <script>
        const DB_URL = "https://api.npoint.io/46e4c7604473efbc3e43"; 
        const IMGBB_API_KEY = "3c3f25c798991dcdb21c4b7ec82efec7";
        let products = [];

        async function loadData() {
            try {
                let res = await fetch(DB_URL);
                products = await res.json();
                if (!Array.isArray(products)) products = [];
                render();
            } catch(e) {
                products = [];
                render();
            }
        }

        function render() {
            let list = document.getElementById('productList');
            list.innerHTML = "";
            products.forEach((p, i) => {
                list.innerHTML += `
                    <div class="product-item">
                        <button class="delete-btn" onclick="removeProduct(${i})">মুছে ফেলুন</button>
                        <div class="input-group">
                            <label>পণ্যের নাম:</label>
                            <input type="text" id="name-${i}" value="${p.name || ''}" placeholder="যেমন: দেশি বেগুন">
                        </div>
                        <div class="input-group">
                            <label>বিবরণ:</label>
                            <textarea id="desc-${i}" rows="2" placeholder="সংক্ষিপ্ত বিবরণ">${p.desc || ''}</textarea>
                        </div>
                        <div class="input-group">
                            <label>দাম (৳):</label>
                            <input type="number" id="price-${i}" value="${p.price || 0}">
                        </div>
                        <div class="input-group">
                            <label>ছবি বেছে নিন (মোবাইল গ্যালারি):</label>
                            <input type="file" accept="image/*" onchange="processAndUpload(event, ${i})">
                            <div id="status-${i}" class="upload-status"></div>
                            <img id="preview-${i}" class="preview-img" src="${p.img || 'https://via.placeholder.com/90?text=No+Image'}">
                        </div>
                    </div>
                `;
            });
        }

        // ছবি প্রসেস ও ImgBB-তে আপলোড ফাংশন
        function processAndUpload(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            let statusBox = document.getElementById(`status-${index}`);
            statusBox.style.color = "#ff9800";
            statusBox.innerText = "⏳ ছবি প্রসেসিং ও আপলোড হচ্ছে...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Canvas দিয়ে ছবি সাইজ ছোট করা
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Blob বানিয়ে ImgBB-তে পাঠানো
                    canvas.toBlob(async function(blob) {
                        let formData = new FormData();
                        formData.append("image", blob, "photo.jpg");

                        try {
                            let response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                                method: "POST",
                                body: formData
                            });
                            let result = await response.json();

                            if (result.success && result.data && result.data.url) {
                                let imageUrl = result.data.url;
                                products[index].img = imageUrl;
                                document.getElementById(`preview-${index}`).src = imageUrl;
                                statusBox.style.color = "#2e7d32";
                                statusBox.innerText = "✅ ছবি সফলভাবে আপলোড হয়েছে!";
                            } else {
                                statusBox.style.color = "red";
                                statusBox.innerText = "❌ আপলোড হয়নি, আবার চেষ্টা করুন।";
                            }
                        } catch (err) {
                            statusBox.style.color = "red";
                            statusBox.innerText = "❌ ইন্টারনেটে সমস্যা হচ্ছে!";
                        }
                    }, 'image/jpeg', 0.8);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addNewProduct() {
            products.push({ name: "", desc: "", price: 0, img: "" });
            render();
        }

        function removeProduct(i) {
            products.splice(i, 1);
            render();
        }

        async function saveData() {
            products.forEach((p, i) => {
                p.name = document.getElementById(`name-${i}`).value;
                p.desc = document.getElementById(`desc-${i}`).value;
                p.price = parseFloat(document.getElementById(`price-${i}`).value) || 0;
            });

            try {
                let res = await fetch(DB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(products)
                });
                
                if(res.ok) {
                    alert("✅ পণ্য ও ছবি সফলভাবে সাইটে আপডেট সেভ হয়েছে!");
                } else {
                    alert("❌ সেভ করা যায়নি। আবার চেষ্টা করুন।");
                }
            } catch(e) {
                alert("❌ নেটওয়ার্ক ত্রুটি!");
            }
        }

        loadData();
    </script>
</body>
</html>
