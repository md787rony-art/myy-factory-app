<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন বিল অনুমোদন প্যানেল</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; margin: 0; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn-approve { background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-approve:hover { background-color: #218838; }
        .view-img { color: #007bff; text-decoration: none; font-weight: bold; }
        .loading { text-align: center; font-size: 18px; color: #666; padding: 20px; }
        .no-data { text-align: center; color: #dc3545; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>👑 এডমিন বিল অনুমোদন প্যানেল (Pending Requests)</h2>
    <div id="loading" class="loading">গুগল শিট থেকে ডেটা লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন...</div>
    
    <table id="memoTable" style="display: none;">
        <thead>
            <tr>
                <th>তারিখ</th>
                <th>মিস্ত্রি নাম</th>
                <th>টাইপ</th>
                <th>মিস্ত্রি ধরণ</th>
                <th>কাজের বিবরণ</th>
                <th>টাকা</th>
                <th>মেমো/ছবি</th>
                <th>অ্যাকশন</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div id="noData" class="no-data" style="display: none;">বর্তমানে কোনো পেন্ডিং বিল অনুমোদনের অপেক্ষায় নেই।</div>
</div>

<script>
// ⚠️ আপনার নতুন জেনারেট হওয়া New Deployment Web App URL টি নিচের লাইনে বসাবেন
const scriptUrl = "https://script.google.com/macros/s/AKfycbx7Fym_Dt5Aq7jV2CzuiKlW4IEWo65sx19CAvBY2YVv4HRwIbkL_-d8EdSiBciGdNWHCQ/exec";

window.onload = function() {
    fetch(scriptUrl)
    .then(res => res.json())
    .then(data => {
        document.getElementById("loading").style.display = "none";
        const tbody = document.getElementById("tableBody");
        
        if(!data || data.length === 0) {
            document.getElementById("noData").style.display = "block";
            return;
        }
        
        document.getElementById("memoTable").style.display = "table";
        data.forEach(item => {
            let dateObj = new Date(item.date);
            let formattedDate = dateObj.toLocaleDateString('bn-BD');
            
            let imgLink = item.fileUrl && item.fileUrl.includes("http") ? `<a href="${item.fileUrl}" target="_blank" class="view-img">👁️ দেখুন</a>` : "নেই";
            
            let row = `<tr>
                <td>${formattedDate}</td>
                <td><b>${item.user}</b></td>
                <td>${item.workType}</td>
                <td>${item.mistriType}</td>
                <td>${item.productDetail}</td>
                <td><b>${item.amount} ৳</b></td>
                <td>${imgLink}</td>
                <td><button class="btn-approve" onclick="approveMemo('${item.memoId}', this)">Approve ✅</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    })
    .catch(err => {
        document.getElementById("loading").innerText = "ডেটা লোড করতে ব্যর্থ! ব্যাকএন্ডে স্প্রেডশীট আইডি ঠিক করুন।";
    });
};

function approveMemo(memoId, button) {
    if(confirm("আপনি কি নিশ্চিতভাবে এই বিলটি অনুমোদন করতে চান? এটি সরাসরি মূল শিটে চলে যাবে।")) {
        button.innerText = "Processing...";
        button.disabled = true;
        
        fetch(scriptUrl, {
            method: "POST",
            body: JSON.stringify({
                action: "approve",
                memoId: memoId
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                alert("বিলটি সফলভাবে অনুমোদিত হয়েছে!");
                location.reload();
            } else {
                alert("ত্রুটি: " + data.message);
                button.innerText = "Approve ✅";
                button.disabled = false;
            }
        })
        .catch(() => {
            alert("নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।");
            button.innerText = "Approve ✅";
            button.disabled = false;
        });
    }
}
</script>
</body>
</html>
