<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মালিক অ্যাডমিন প্যানেল</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: linear-gradient(135deg, #fbcfe8 0%, #e2e8f0 100%); color: #000; padding: 20px; min-height: 100vh; }
        .box-3d { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.8); margin-bottom: 20px; }
        h2 { margin-bottom: 15px; }
        .login-screen { max-width: 400px; margin: 100px auto; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; color: #000; }
        button { padding: 12px 20px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .admin-dashboard { display: none; max-width: 1000px; margin: 0 auto; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #cbd5e1; color: #000; }
        th { background-color: #000; color: #fff; }
        .btn-approve { background: #10b981; color: white; margin-right: 5px; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div id="admin-login" class="box-3d login-screen">
    <h2>👑 মালিক অ্যাডমিন লগইন</h2>
    <input type="text" id="admin-user" placeholder="অ্যাডমিন ইউজারনেম">
    <input type="password" id="admin-pass" placeholder="অ্যাডমিন পাসওয়ার্ড">
    <button onclick="loginAdmin()">প্রবেশ করুন</button>
</div>

<div id="admin-dash" class="admin-dashboard">
    <div class="box-3d">
        <h2>📊 মিস্ত্রিদের পেন্ডিং রিকোয়েস্ট তালিকা</h2>
        <table>
            <thead>
                <tr>
                    <th>তারিখ ও সময়</th>
                    <th>মিস্ত্রি নাম</th>
                    <th>কাজের বিবরণ</th>
                    <th>হাজিরা</th>
                    <th>টাকার পরিমাণ</th>
                    <th>মেমো/ছবি</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody id="pending-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    // 🔗 নিচে আপনার তৈরি করা গুগল ওয়েব অ্যাপের লিংকটি বসাবেন
    const GOOGLE_API_URL = "https://script.google.com/macros/s/XXXXX/exec"; 

    function loginAdmin() {
        const u = document.getElementById("admin-user").value;
        const p = document.getElementById("admin-pass").value;

        if(u === 'admin' && p === 'owner2026') {
            document.getElementById("admin-login").style.display = "none";
            document.getElementById("admin-dash").style.display = "block";
            loadPendingReports();
        } else { alert("❌ ভুল পাসওয়ার্ড!"); }
    }

    function loadPendingReports() {
        fetch(`${GOOGLE_API_URL}?action=get_pending`)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById("pending-table-body");
            tbody.innerHTML = data.length ? "" : "<tr><td colspan='7' style='text-align:center;'>কোনো পেন্ডিং ডাটা নেই।</td></tr>";
            
            data.forEach(row => {
                let imgHtml = row.image_path !== "No Image" ? `<a href="${row.image_path}" target="_blank">লিংক দেখুন</a>` : "ছবি নেই";
                
                tbody.innerHTML += `
                    <tr>
                        <td>${row.date} (${row.time})</td>
                        <td>${row.username.toUpperCase()}</td>
                        <td>${row.details}</td>
                        <td>${row.hajira_count}</td>
                        <td>${row.amount} ৳</td>
                        <td>${imgHtml}</td>
                        <td>
                            <button class="btn-approve" onclick="updateStatus('${row.id}', 'Approved')">✔ Approve</button>
                            <button class="btn-reject" onclick="updateStatus('${row.id}', 'Rejected')">✖ Reject</button>
                        </td>
                    </tr>`;
            });
        });
    }

    function updateStatus(id, status) {
        fetch(`${GOOGLE_API_URL}?action=update_status&id=${id}&status=${status}`, { method: "POST" })
        .then(res => res.json())
        .then(res => {
            if(res.status === "SUCCESS") { alert(`সফলভাবে ${status} করা হয়েছে!`); loadPendingReports(); }
            else { alert("ব্যর্থ হয়েছে!"); }
        });
    }
</script>
</body>
</html>
