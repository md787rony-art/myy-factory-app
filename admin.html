<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সহজ বাজার - অ্যাডমিন কন্ট্রোল</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #e8f5e9; padding: 15px; color: #333; }
        .admin-box { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #1b5e20; text-align: center; font-size: 20px; margin-bottom: 15px; }
        .item-form { background: #f9f9f9; border: 1px solid #c8e6c9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; margin-bottom: 3px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .add-btn { background: #2e7d32; color: white; padding: 10px; border: none; border-radius: 5px; flex: 1; cursor: pointer; font-weight: bold; }
        .save-btn { background: #ff9800; color: white; padding: 12px; border: none; border-radius: 5px; flex: 2; cursor: pointer; font-weight: bold; }
        .delete-btn { background: #d32f2f; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; float: right; font-size: 12px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h1>⚙️ সহজ বাজার - অ্যাডমিন কন্ট্রোল</h1>
        <div id="itemList"><p style="text-align:center;">ডাটা লোড হচ্ছে...</p></div>

        <div class="btn-group">
            <button class="add-btn" onclick="addNewProduct()">➕ নতুন পণ্য যোগ করুন</button>
            <button class="save-btn" onclick="saveData()">💾 সাইটে আপডেট সেভ করুন</button>
        </div>
    </div>

    <script>
        // আপনার ফ্রি রেডিমেড ডাটাবেজ লিংক (কোনো আইডি বা কি লাগবে না)
        const DB_URL = "https://api.npoint.io/46e4c7604473efbc3e43"; 

        let products = [];

        async function loadData() {
            try {
                let res = await fetch(DB_URL);
                products = await res.json();
                render();
            } catch(e) {
                document.getElementById('itemList').innerHTML = "<p style='color:red; text-align:center;'>ডাটা লোড হয়নি। সংযোগ চেক করুন।</p>";
            }
        }

        function render() {
            let list = document.getElementById('itemList');
            list.innerHTML = "";
            products.forEach((p, i) => {
                list.innerHTML += `
                    <div class="item-form">
                        <button class="delete-btn" onclick="removeProduct(${i})">মুছে ফেলুন</button>
                        <div class="input-group">
                            <label>পণ্যের নাম:</label>
                            <input type="text" id="name-${i}" value="${p.name || ''}">
                        </div>
                        <div class="input-group">
                            <label>দাম (৳):</label>
                            <input type="number" id="price-${i}" value="${p.price || 0}">
                        </div>
                        <div class="input-group">
                            <label>ছবি লিংক:</label>
                            <input type="text" id="img-${i}" value="${p.img || ''}">
                        </div>
                    </div>
                `;
            });
        }

        function addNewProduct() {
            products.push({ name: "নতুন পণ্য", price: 0, img: "" });
            render();
        }

        function removeProduct(i) {
            products.splice(i, 1);
            render();
        }

        async function saveData() {
            let updated = products.map((p, i) => ({
                name: document.getElementById(`name-${i}`).value,
                price: parseFloat(document.getElementById(`price-${i}`).value) || 0,
                img: document.getElementById(`img-${i}`).value
            }));

            try {
                let res = await fetch(DB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updated)
                });
                if(res.ok) alert("✅ সফলভাবে সেভ হয়েছে!");
                else alert("❌ সেভ করা যায়নি।");
            } catch(e) {
                alert("❌ নেটওয়ার্ক ত্রুটি!");
            }
        }

        loadData();
    </script>
</body>
</html>
