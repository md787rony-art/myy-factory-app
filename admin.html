<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সহজ বাজার - অ্যাডমিন কন্ট্রোল</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #e8f5e9; padding: 15px; color: #333; }
        .admin-box { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1b5e20; text-align: center; font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #c8e6c9; padding-bottom: 10px; }
        .item-form { background: #f9f9f9; border: 1px solid #c8e6c9; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: bold; color: #2e7d32; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; margin-top: 8px; border: 1px solid #ddd; display: block; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .add-btn { background: #2e7d32; color: white; padding: 12px; border: none; border-radius: 6px; flex: 1; cursor: pointer; font-weight: bold; font-size: 14px; }
        .save-btn { background: #ff9800; color: white; padding: 12px; border: none; border-radius: 6px; flex: 2; cursor: pointer; font-weight: bold; font-size: 14px; }
        .delete-btn { background: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; float: right; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h1>⚙️ সহজ বাজার - অ্যাডমিন প্যানেল</h1>
        <div id="itemList"><p style="text-align:center;">ডাটা লোড হচ্ছে...</p></div>

        <div class="btn-group">
            <button class="add-btn" onclick="addNewProduct()">➕ নতুন পণ্য যোগ করুন</button>
            <button class="save-btn" onclick="saveData()">💾 সাইটে আপডেট সেভ করুন</button>
        </div>
    </div>

    <script>
        const DB_URL = "https://api.npoint.io/46e4c7604473efbc3e43"; 
        let products = [];

        async function loadData() {
            try {
                let res = await fetch(DB_URL);
                products = await res.json();
                render();
            } catch(e) {
                document.getElementById('itemList').innerHTML = "<p style='color:red; text-align:center;'>ডাটা লোড করতে সমস্যা হয়েছে। পেজ রিফ্রেশ দিন।</p>";
            }
        }

        function render() {
            let list = document.getElementById('itemList');
            list.innerHTML = "";
            products.forEach((p, i) => {
                list.innerHTML += `
                    <div class="item-form">
                        <button class="delete-btn" onclick="removeProduct(${i})">মুছে ফেলুন</button>
                        <div class="input-group">
                            <label>পণ্যের নাম:</label>
                            <input type="text" id="name-${i}" value="${p.name || ''}" placeholder="যেমন: দেশি বেগুন">
                        </div>
                        <div class="input-group">
                            <label>দাম (৳):</label>
                            <input type="number" id="price-${i}" value="${p.price || 0}">
                        </div>
                        <div class="input-group">
                            <label>ছবি আপলোড করুন (গ্যালারি থেকে বেছে নিন):</label>
                            <input type="file" accept="image/*" onchange="handleImageUpload(event, ${i})">
                            <img id="preview-${i}" class="preview-img" src="${p.img || 'https://via.placeholder.com/80?text=No+Image'}">
                        </div>
                    </div>
                `;
            });
        }

        // ছবি অটোমেটিক রেসাইজ ও রিকমপ্রেস করার ফাংশন
        function handleImageUpload(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // ম্যাক্সিমাম ৩০০ পিক্সেল চওড়া করা হবে যাতে সাইজ কম থাকে
                    const MAX_WIDTH = 300;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // ছবি কোয়ালিটি ০.৬ এ কমিয়ে সাইজ মাত্র ৫০-৮০ KB তে নিয়ে আসা হবে
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    
                    products[index].img = compressedDataUrl;
                    document.getElementById(`preview-${index}`).src = compressedDataUrl;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addNewProduct() {
            products.push({ name: "", price: 0, img: "" });
            render();
        }

        function removeProduct(i) {
            products.splice(i, 1);
            render();
        }

        async function saveData() {
            products.forEach((p, i) => {
                p.name = document.getElementById(`name-${i}`).value;
                p.price = parseFloat(document.getElementById(`price-${i}`).value) || 0;
            });

            try {
                let res = await fetch(DB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(products)
                });
                if(res.ok) alert("✅ পণ্য ও ছবির ডাটা সফলভাবে সেভ হয়েছে!");
                else alert("❌ সেভ করা যায়নি। নেটওয়ার্ক চেক করুন।");
            } catch(e) {
                alert("❌ নেটওয়ার্ক ত্রুটি!");
            }
        }

        loadData();
    </script>
</body>
</html>
