<script>
    // ফিক্সড ও স্থায়ী ডাটাবেজ লিংক
    const DB_URL = "https://api.npoint.io/46e4c7604473efbc3e43"; 

    let products = [];

    async function loadData() {
        try {
            let res = await fetch(DB_URL);
            products = await res.json();
            render();
        } catch(e) {
            document.getElementById('itemList').innerHTML = "<p style='color:red; text-align:center;'>ডাটা লোড হয়নি। পেজ রিফ্রেশ দিন।</p>";
        }
    }

    function render() {
        let list = document.getElementById('itemList');
        list.innerHTML = "";
        products.forEach((p, i) => {
            list.innerHTML += `
                <div class="item-form">
                    <button class="delete-btn" onclick="removeProduct(${i})">মুছে ফেলুন</button>
                    <div class="input-group">
                        <label>পণ্যের নাম:</label>
                        <input type="text" id="name-${i}" value="${p.name || ''}">
                    </div>
                    <div class="input-group">
                        <label>দাম (৳):</label>
                        <input type="number" id="price-${i}" value="${p.price || 0}">
                    </div>
                    <div class="input-group">
                        <label>ছবি লিংক (Direct Image URL):</label>
                        <input type="text" id="img-${i}" value="${p.img || ''}" placeholder="https://i.ibb.co/.../photo.jpg">
                    </div>
                </div>
            `;
        });
    }

    function addNewProduct() {
        products.push({ name: "নতুন পণ্য", price: 0, img: "" });
        render();
    }

    function removeProduct(i) {
        products.splice(i, 1);
        render();
    }

    async function saveData() {
        // ইমেজ লিংক ফিল্টার করে শুধুমাত্র ডাইরেক্ট লিংক নেওয়া হচ্ছে
        let updated = products.map((p, i) => {
            let rawImg = document.getElementById(`img-${i}`).value.trim();
            
            // যদি ভুল করে পুরো HTML কোড পেস্ট করে থাকেন, তবে তা থেকে লিংক বের করে নিবে
            if(rawImg.includes('src="')) {
                let match = rawImg.match(/src="([^"]+)"/);
                if(match && match[1]) rawImg = match[1];
            }

            return {
                name: document.getElementById(`name-${i}`).value,
                price: parseFloat(document.getElementById(`price-${i}`).value) || 0,
                img: rawImg
            };
        });

        try {
            let res = await fetch(DB_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updated)
            });
            if(res.ok) {
                alert("✅ সফলভাবে সেভ হয়েছে!");
                loadData();
            } else {
                alert("❌ সেভ করা যায়নি। লিংক চেক করুন।");
            }
        } catch(e) {
            alert("❌ নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।");
        }
    }

    loadData();
</script>
