<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সহজ বাজার</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6f8; }
        nav { background: #2e7d32; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: white; padding: 10px; border-radius: 8px; border: 1px solid #ddd; text-align: center; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 5px; }
        .title { font-weight: bold; color: #2e7d32; margin: 8px 0; }
        .price { color: #d32f2f; font-weight: bold; margin-bottom: 8px; }
        .btn { background: #25d366; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <nav>🛒 সহজ বাজার</nav>

    <div class="container">
        <div class="grid" id="products"><p style="text-align:center; grid-column:1/-1;">পণ্য লোড হচ্ছে...</p></div>
    </div>

    <script>
        const DB_URL = "https://api.npoint.io/46e4c7604473efbc3e43";

        async function loadProducts() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                let grid = document.getElementById('products');
                grid.innerHTML = "";

                data.forEach(p => {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${p.img || 'https://via.placeholder.com/150'}">
                            <div class="title">${p.name}</div>
                            <div class="price">৳${p.price}</div>
                            <button class="btn" onclick="order('${p.name}', ${p.price})">অর্ডার করুন</button>
                        </div>
                    `;
                });
            } catch(e) {
                document.getElementById('products').innerHTML = "<p style='color:red; text-align:center;'>ডাটা লোড করা যায়নি।</p>";
            }
        }

        function order(name, price) {
            let msg = `হ্যালো, আমি এটি অর্ডার করতে চাই:%0Aপণ্য: ${name}%0Aদাম: ৳${price}`;
            window.open(`https://wa.me/8801?text=${msg}`, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
