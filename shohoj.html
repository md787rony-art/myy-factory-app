<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পচা বাজার - POCHA BAZAR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; padding-bottom: 60px; }

        /* হেডার */
        header { background: #022c22; padding: 20px; text-align: center; border-bottom: 4px solid #f59e0b; }
        header h1 { font-size: 28px; color: #ffffff; }
        header h1 span { color: #f59e0b; }
        header p { color: #34d399; font-size: 14px; margin-top: 5px; }

        /* অফার ব্যানার */
        .banner { background: #ef4444; color: white; text-align: center; padding: 8px; font-weight: bold; font-size: 14px; }

        /* মেইন কন্টেইনার */
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        /* পণ্য গ্রিড (সাধারণ ইউজারদের জন্য) */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .product-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; padding: 10px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; background: #0f172a; }
        .product-card h3 { font-size: 16px; margin: 10px 0 5px 0; color: #f8fafc; }
        .product-card p { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        .product-card .price { font-size: 16px; color: #f59e0b; font-weight: bold; margin-bottom: 10px; }
        .buy-btn { background: #10b981; color: white; border: none; padding: 8px; border-radius: 5px; width: 100%; cursor: pointer; font-weight: bold; }

        /* --- 🕵️‍♂️ লুকানো অ্যাডমিন সেকশন (প্রথমে হাইড থাকবে) --- */
        #adminPanel { display: none; background: #ffffff; color: #333; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 2px solid #f59e0b; }
        .admin-title { font-size: 20px; font-weight: bold; color: #022c22; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .admin-close { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .product-item-edit { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; border-left: 5px solid #10b981; }
        .input-group { margin-bottom: 10px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #022c22; margin-bottom: 4px; }
        .input-group input, .input-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 13px; }
        
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; margin-top: 5px; border: 1px solid #10b981; }
        .upload-status { font-size: 12px; font-weight: bold; margin-top: 4px; }

        .admin-controls { display: flex; gap: 10px; margin-top: 15px; }
        .add-btn { background: #10b981; color: white; border: none; padding: 10px; border-radius: 5px; flex: 1; font-weight: bold; cursor: pointer; }
        .save-btn { background: #f59e0b; color: #0f172a; border: none; padding: 10px; border-radius: 5px; flex: 2; font-weight: bold; cursor: pointer; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; float: right; font-size: 11px; cursor: pointer; }

        /* ফুটার ও লুকানো অ্যাডমিন বাটন */
        footer { text-align: center; padding: 20px; color: #64748b; font-size: 12px; position: relative; }
        .hidden-admin-btn { position: absolute; right: 10px; bottom: 10px; opacity: 0.15; cursor: pointer; font-size: 14px; user-select: none; }
        .hidden-admin-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="banner">🔥 ১০% ছাড় প্রথম অর্ডারে! কোড: FRESH10</div>

    <header>
        <h1>🛒 <span>পচা বাজার</span> (POCHA BAZAR)</h1>
        <p>নামে পচা হলেও পণ্য ১০০% তাজা ও বিশুদ্ধ!</p>
    </header>

    <div class="container">
        
        <!-- 🕵️‍♂️ অ্যাডমিন কন্ট্রোল প্যানেল (লুকানো থাকবে) -->
        <div id="adminPanel">
            <div class="admin-title">
                ⚙️ অ্যাডমিন কন্ট্রোল প্যানেল
                <button class="admin-close" onclick="closeAdmin()">✖ বন্ধ করুন</button>
            </div>
            
            <div id="adminProductList"></div>

            <div class="admin-controls">
                <button class="add-btn" onclick="addNewProduct()">➕ নতুন পণ্য যোগ করুন</button>
                <button class="save-btn" onclick="saveData()">💾 সাইটে আপডেট সেভ করুন</button>
            </div>
        </div>

        <!-- 🛍️ সাধারণ ইউজার ভিউ (সবাই দেখতে পাবে) -->
        <h2 style="margin-bottom: 15px; font-size: 18px; color: #34d399;">🥬 আজকের তাজা বাজার:</h2>
        <div id="userProductGrid" class="product-grid">
            <p style="grid-column: 1/-1; text-align:center;">🔄 পণ্য লোড হচ্ছে...</p>
        </div>

    </div>

    <footer>
        <p>© ২০২৬ পচা বাজার | md787rony-art.github.io</p>
        <!-- 🤫 একদম এক কোণায় আবছা হয়ে লুকানো বাটন -->
        <span class="hidden-admin-btn" onclick="openAdmin()" title="Admin Control">⚙️</span>
    </footer>

    <script>
        const DB_URL = "https://api.npoint.io/46e4c7604473efbc3e43"; 
        const IMGBB_API_KEY = "3c3f25c798991dcdb21c4b7ec82efec7";
        const ADMIN_PASSWORD = "1234"; // 🔐 আপনার গোপনীয় পাসওয়ার্ড (প্রয়োজনে চেঞ্জ করবেন)
        
        let products = [];

        // ১. ডাটা লোড করা
        async function loadData() {
            try {
                let res = await fetch(DB_URL);
                products = await res.json();
                if (!Array.isArray(products)) products = [];
                renderUserView();
            } catch(e) {
                products = [];
                renderUserView();
            }
        }

        // ২. সাধারণ গ্রাহকদের জন্য প্রোডাক্ট কার্ড দেখানো
        function renderUserView() {
            let grid = document.getElementById('userProductGrid');
            grid.innerHTML = "";
            
            if(products.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">বর্তমানে কোনো পণ্য নেই।</p>`;
                return;
            }

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img || 'https://via.placeholder.com/150?text=No+Image'}" alt="${p.name}">
                        <div>
                            <h3>${p.name || 'পণ্য'}</h3>
                            <p>${p.desc || ''}</p>
                        </div>
                        <div>
                            <div class="price">৳ ${p.price || 0}</div>
                            <button class="buy-btn" onclick="alert('অর্ডার করতে কল করুন অথবা মেসেজ দিন!')">অর্ডার করুন</button>
                        </div>
                    </div>
                `;
            });
        }

        // ৩. অ্যাডমিন ভিউ রেন্ডার করা
        function renderAdminView() {
            let list = document.getElementById('adminProductList');
            list.innerHTML = "";

            products.forEach((p, i) => {
                list.innerHTML += `
                    <div class="product-item-edit">
                        <button class="delete-btn" onclick="removeProduct(${i})">🗑️ মুছে ফেলুন</button>
                        <div class="input-group">
                            <label>পণ্যের নাম:</label>
                            <input type="text" id="name-${i}" value="${p.name || ''}" oninput="updateLocalData(${i})">
                        </div>
                        <div class="input-group">
                            <label>বিবরণ:</label>
                            <textarea id="desc-${i}" rows="2" oninput="updateLocalData(${i})">${p.desc || ''}</textarea>
                        </div>
                        <div class="input-group">
                            <label>দাম (৳):</label>
                            <input type="number" id="price-${i}" value="${p.price || 0}" oninput="updateLocalData(${i})">
                        </div>
                        <div class="input-group">
                            <label>ছবি নির্বাচন করুন:</label>
                            <input type="file" accept="image/*" onchange="processAndUpload(event, ${i})">
                            <div id="status-${i}" class="upload-status"></div>
                            <img id="preview-${i}" class="preview-img" src="${p.img || 'https://via.placeholder.com/80?text=No+Image'}">
                        </div>
                    </div>
                `;
            });
        }

        // ৪. লুকানো অ্যাডমিন প্যানেল ওপেন করা
        function openAdmin() {
            let pass = prompt("🔐 অ্যাডমিন অ্যাক্সেস পাসওয়ার্ড দিন:");
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if(pass !== null) {
                alert("❌ ভুল পাসওয়ার্ড!");
            }
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        function updateLocalData(i) {
            products[i].name = document.getElementById(`name-${i}`).value;
            products[i].desc = document.getElementById(`desc-${i}`).value;
            products[i].price = parseFloat(document.getElementById(`price-${i}`).value) || 0;
        }

        // ৫. ছবি আপলোড ও কমপ্রেসন
        function processAndUpload(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            let statusBox = document.getElementById(`status-${index}`);
            statusBox.style.color = "#f59e0b";
            statusBox.innerText = "⏳ ছবি আপলোড হচ্ছে...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(async function(blob) {
                        let formData = new FormData();
                        formData.append("image", blob, "photo.jpg");

                        try {
                            let response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                                method: "POST",
                                body: formData
                            });
                            let result = await response.json();

                            if (result.success && result.data && result.data.url) {
                                let imageUrl = result.data.url;
                                products[index].img = imageUrl;
                                document.getElementById(`preview-${index}`).src = imageUrl;
                                statusBox.style.color = "#10b981";
                                statusBox.innerText = "✅ ছবি আপলোড সম্পন্ন!";
                            } else {
                                statusBox.style.color = "#ef4444";
                                statusBox.innerText = "❌ আপলোড ব্যর্থ!";
                            }
                        } catch (err) {
                            statusBox.style.color = "#ef4444";
                            statusBox.innerText = "❌ নেটওয়ার্ক এরর!";
                        }
                    }, 'image/jpeg', 0.8);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addNewProduct() {
            products.push({ name: "", desc: "", price: 0, img: "" });
            renderAdminView();
        }

        function removeProduct(i) {
            if (confirm("পণ্যটি মুছে ফেলতে চান?")) {
                products.splice(i, 1);
                renderAdminView();
            }
        }

        // ৬. ডাটাবেজে ডাটা সেভ করা
        async function saveData() {
            products.forEach((p, i) => {
                p.name = document.getElementById(`name-${i}`).value;
                p.desc = document.getElementById(`desc-${i}`).value;
                p.price = parseFloat(document.getElementById(`price-${i}`).value) || 0;
            });

            try {
                let res = await fetch(DB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(products)
                });
                
                if(res.ok) {
                    alert("✅ সাইট আপডেট করা হয়েছে!");
                    renderUserView(); // কাস্টমার ভিউ আপডেট
                    closeAdmin();     // অ্যাডমিন প্যানেল হাইড
                } else {
                    alert("❌ সেভ করা যায়নি।");
                }
            } catch(e) {
                alert("❌ নেটওয়ার্ক ত্রুটি!");
            }
        }

        // পেজ লোড হওয়ার পর প্রসেস চালু
        loadData();
    </script>
</body>
</html>
