<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base67 - ডিজিটাল কারখানা খাতা</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f4f8; padding: 15px 10px; color: #2c3e50; }
        
        .container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 25px; }
        @media (max-width: 1150px) { .container { grid-template-columns: 1fr; } }
        
        .box { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 5px solid #3498db; height: max-content; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 15px 20px; border-radius: 12px; }
        
        .btn-settings { background: #e67e22; color: white; padding: 8px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-settings:hover { background: #d35400; }
        
        .step-container { display: flex; justify-content: space-between; margin-bottom: 20px; background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .step-indicator { font-size: 0.8rem; font-weight: bold; color: #94a3b8; padding: 6px 10px; border-radius: 20px; background: #fff; border: 1px solid #e2e8f0; flex: 1; text-align: center; margin: 0 3px; }
        .step-indicator.active { background: #3498db; color: white; border-color: #3498db; }
        
        .form-step { display: none; }
        .form-step.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        h3 { font-size: 1.1rem; color: #2c3e50; margin: 10px 0 15px 0; background: #eaf2f8; padding: 10px; border-left: 5px solid #3498db; font-weight: bold; border-radius: 0 6px 6px 0; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.88rem; margin-bottom: 6px; font-weight: 600; color: #34495e; }
        
        .input-control { display: flex; align-items: center; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; color: #2c3e50; }
        .input-control input { border: none; text-align: center; padding: 12px 5px; }
        input:focus, select:focus { border-color: #3498db; outline: none; }
        
        .count-btn { background: #f8fafc; border: none; color: #3498db; font-weight: bold; width: 45px; height: 46px; cursor: pointer; font-size: 1.2rem; }
        .count-btn:hover { background: #e2e8f0; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .step-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-nav { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; text-align: center; }
        .btn-next { background: #2ecc71; color: white; }
        .btn-prev { background: #94a3b8; color: white; }
        
        button.main-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-save-db { background: linear-gradient(135deg, #2c3e50, #34495e); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-download-img { background: #9b59b6; color: white; padding: 8px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        
        .result-box { margin-top: 25px; background: linear-gradient(135deg, #1e293b, #334155); color: white; padding: 20px; border-radius: 14px; text-align: center; }
        .total-amount { font-size: 2.3rem; font-weight: bold; color: #2ecc71; margin: 5px 0; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; padding: 25px; border-radius: 16px; width: 90%; max-width: 450px; position: relative; max-height: 85vh; overflow-y: auto; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #94a3b8; }
        
        .db-box { border-top: 5px solid #3498db; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        #capture_area { background: white; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
        
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: left; min-width: 700px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; vertical-align: top; }
        th:last-child, td:last-child { border-right: none; }
        th { background: #f8fafc; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 0.78rem; }
        
        .cat-title { font-weight: bold; color: #1e293b; margin-top: 8px; display: block; border-bottom: 1px dashed #cbd5e1; padding-bottom: 4px; font-size: 0.85rem; }
        .cat-details { font-size: 0.8rem; color: #64748b; padding-left: 8px; line-height: 1.5; margin: 4px 0; }
        .plus-cost { color: #e67e22; font-weight: bold; font-size: 1.1rem; text-align: center; display: block; }
        .db-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .record-divider { border: none; border-top: 2px dashed #3498db; margin: 15px 0; opacity: 0.5; }

        .btn-action-download { padding: 6px 10px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; display: block; width: 100%; text-align: center; }
        .btn-action-delete { padding: 6px 10px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; display: block; width: 100%; text-align: center; }
    </style>
</head>
<body>

<div class="header-area">
    <h2>📁 খাতা</h2>
    <button class="btn-settings" onclick="openSettings()">⚙️ রেট সেটিংস</button>
</div>

<div class="container">
    
    <div class="box">
        <div class="step-container">
            <div class="step-indicator active" id="ind-1" onclick="jumpToStep(1)">১. আইটেম</div>
            <div class="step-indicator" id="ind-2" onclick="jumpToStep(2)">২. বোর্ড</div>
            <div class="step-indicator" id="ind-3" onclick="jumpToStep(3)">৩. পার্টস</div>
            <div class="step-indicator" id="ind-4" onclick="jumpToStep(4)">৪. খরচ</div>
        </div>

        <form id="calcForm" onsubmit="event.preventDefault();">
            
            <div class="form-step active" id="step-1">
                <h3>📌 ১. ফার্নিচার</h3>
                <div class="form-group">
                    <label>মডেল নাম্বার (Model No.)</label>
                    <input type="text" id="model_no" placeholder="যেমন: B-102" required>
                </div>
                <div class="form-group">
                    <label>প্রোডাক্টের নাম (সিলেক্ট করলেই পরের ধাপে যাবে)</label>
                    <select id="product_type" onchange="handleProductChangeAuto()">
                        <option value="" disabled selected>--- সিলেক্ট করুন ---</option>
                        <option value="almirah_4">আলমিরা (৪ দরজা)</option>
                        <option value="almirah_3">আলমিরা (৩ দরজা)</option>
                        <option value="almirah_2">আলমিরা (২ দরজা)</option>
                        <option value="dressing_table">ড্রেসিং টেবিল (মিররসহ)</option>
                        <option value="wardrobe_4d2dr">ওয়ারড্রব (৪ ড্রয়ার + ২ দরজা)</option>
                        <option value="wardrobe_4d">ওয়ারড্রব (শুধু ৪ ড্রয়ার)</option>
                        <option value="bed">খাট (Bed)</option>
                        <option value="office_table">অফিস টেবিল</option>
                        <option value="others">অন্যান্য আইটেম</option>
                    </select>
                </div>
            </div>

            <div class="form-step" id="step-2">
                <h3>🪵 ২. Boards (পিস)</h3>
                <div class="form-group">
                    <label>১৮ মিলি MDF</label>
                    <div class="input-control">
                        <button type="button" class="count-btn" onclick="stepInput('qty_18mm', -1)">-</button>
                        <input type="number" id="qty_18mm" value="0" step="any">
                        <button type="button" class="count-btn" onclick="stepInput('qty_18mm', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>১৫ মিলি MDF</label>
                    <div class="input-control">
                        <button type="button" class="count-btn" onclick="stepInput('qty_15mm', -1)">-</button>
                        <input type="number" id="qty_15mm" value="0" step="any">
                        <button type="button" class="count-btn" onclick="stepInput('qty_15mm', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>৬ মিলি প্লাই/বোর্ড</label>
                    <div class="input-control">
                        <button type="button" class="count-btn" onclick="stepInput('qty_6mm', -1)">-</button>
                        <input type="number" id="qty_6mm" value="0" step="any">
                        <button type="button" class="count-btn" onclick="stepInput('qty_6mm', 1)">+</button>
                    </div>
                </div>
                <div class="step-buttons">
                    <button type="button" class="btn-nav btn-prev" onclick="changeStep(-1)">⬅️ পেছনে</button>
                    <button type="button" class="btn-nav btn-next" onclick="changeStep(1)">ঠিক আছে, পরের ধাপ 👍</button>
                </div>
            </div>

            <div class="form-step" id="step-3">
                <h3>🔩 ৩. Hardware & Glass</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label>তালা লেগেছে (টি)</label>
                        <div class="input-control">
                            <button type="button" class="count-btn" onclick="stepInput('qty_lock', -1)">-</button>
                            <input type="number" id="qty_lock" value="0">
                            <button type="button" class="count-btn" onclick="stepInput('qty_lock', 1)">+</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>হ্যান্ডেল লেগেছে (টি)</label>
                        <div class="input-control">
                            <button type="button" class="count-btn" onclick="stepInput('qty_handle', -1)">-</button>
                            <input type="number" id="qty_handle" value="0">
                            <button type="button" class="count-btn" onclick="stepInput('qty_handle', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>কব্জা / Hinge (টি)</label>
                        <div class="input-control">
                            <button type="button" class="count-btn" onclick="stepInput('qty_hinge', -1)">-</button>
                            <input type="number" id="qty_hinge" value="0">
                            <button type="button" class="count-btn" onclick="stepInput('qty_hinge', 1)">+</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>ড্রয়ার চ্যানেল (সেট)</label>
                        <div class="input-control">
                            <button type="button" class="count-btn" onclick="stepInput('qty_channel', -1)">-</button>
                            <input type="number" id="qty_channel" value="0">
                            <button type="button" class="count-btn" onclick="stepInput('qty_channel', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>লুকিং গ্লাস / আয়না (টি)</label>
                    <div class="input-control">
                        <button type="button" class="count-btn" onclick="stepInput('qty_glass', -1)">-</button>
                        <input type="number" id="qty_glass" value="0">
                        <button type="button" class="count-btn" onclick="stepInput('qty_glass', 1)">+</button>
                    </div>
                </div>
                <div class="step-buttons">
                    <button type="button" class="btn-nav btn-prev" onclick="changeStep(-1)">⬅️ পেছনে</button>
                    <button type="button" class="btn-nav btn-next" onclick="changeStep(1)">ঠিক আছে, পরের ধাপ 👍</button>
                </div>
            </div>

            <div class="form-step" id="step-4">
                <h3>🎨 ৪. রঙ, মিস্ত্রি ও পরিবহন</h3>
                <div class="grid-2">
                    <div class="form-group"><label>সিএনসি বিল</label><input type="number" id="cost_cnc" value="0"></div>
                    <div class="form-group"><label>লেকার কেমিক্যাল</label><input type="number" id="cost_lacquer" value="0"></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>ফিটিং মিস্ত্রি বিল</label><input type="number" id="cost_fitting_labor" value="0"></div>
                    <div class="form-group"><label>কালার মিস্ত্রি বিল</label><input type="number" id="cost_color_labor" value="0"></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>গাড়ি ভাড়া</label><input type="number" id="cost_carrying" value="0"></div>
                    <div class="form-group"><label>খুচরা মাল (স্ক্রু, গ্লু)</label><input type="number" id="cost_others" value="0"></div>
                </div>
                <div class="step-buttons">
                    <button type="button" class="btn-nav btn-prev" onclick="changeStep(-1)">⬅️ পেছনে</button>
                </div>
            </div>
        </form>

        <div class="result-box">
            <h4>মোট উৎপাদন খরচ:</h4>
            <div class="total-amount" id="grandTotal">০.০০ টাকা</div>
            <button class="main-btn btn-save-db" onclick="saveToDatabase()">💾 এই হিসাবটি খাতায় সেভ করুন</button>
        </div>
    </div>

    <div class="db-box">
        <div class="db-header">
            <h2>📋 সেভ খাতা রেকর্ড</h2>
            <button class="btn-download-img" onclick="exportToImage()">📸 পুরো খাতার ছবি</button>
        </div>
        
        <div id="capture_area">
            <h3 style="margin-top: 0; background: #2c3e50; color: white; border-left: 5px solid #9b59b6; padding: 12px 15px;">Base67 কারখানা রেকর্ড খাতা</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 25%;">মডেল / নাম</th>
                            <th style="width: 45%;">মালের ব্রেকডাউন বিবরণী</th>
                            <th style="width: 15%; text-align: center;">মোট খরচ</th>
                            <th class="action-head" style="width: 15%; text-align: center;">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="dbRows"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeSettings()">&times;</span>
        <h2 style="border-bottom: 2px solid #e67e22; padding-bottom:8px; margin-bottom:20px; color: #2c3e50;">⚙️ মালের রেট সেটিংস</h2>
        <form id="settingsForm" onsubmit="saveRates(event)">
            <div class="form-group"><label>১৮ মিলি MDF রেট</label><input type="number" id="cfg_18mm" value="1790" required></div>
            <div class="form-group"><label>১৫ মিলি MDF রেট</label><input type="number" id="cfg_15mm" value="1580" required></div>
            <div class="form-group"><label>৬ মিলি প্লাই রেট</label><input type="number" id="cfg_6mm" value="1300" required></div>
            <div class="form-group"><label>হ্যান্ডেল রেট (পিস)</label><input type="number" id="cfg_handle" value="440" required></div>
            <div class="form-group"><label>ড্রয়ার চ্যানেল রেট (সেট)</label><input type="number" id="cfg_channel" value="200" required></div>
            <div class="form-group"><label>কব্জা রেট (পিস)</label><input type="number" id="cfg_hinge" value="80" required></div>
            <div class="form-group"><label>তালা রেট (পিস)</label><input type="number" id="cfg_lock" value="150" required></div>
            <div class="form-group"><label>লুকিং গ্লাস / আয়না রেট (পিস)</label><input type="number" id="cfg_glass" value="650" required></div>
            <button type="submit" class="main-btn btn-settings" style="width:100%; margin-top:15px;">💾 রেট সেভ করুন</button>
        </form>
    </div>
</div>

<script>
    let currentStep = 1;
    let currentCalculatedTotal = 0;
    let calculatedBoardCost = 0;
    let calculatedHardwareCost = 0;
    let calculatedLaborAndOtherCost = 0;

    // ফার্নিচার সিলেক্ট করার সাথে সাথেই অটোমেটিক ২ নম্বর ধাপে চলে যাবে
    function handleProductChangeAuto() {
        let modelNo = document.getElementById('model_no').value.trim();
        if (!modelNo) { 
            alert('দয়া করে প্রথমে একটি মডেল নাম্বার লিখুন, তারপর আইটেম সিলেক্ট করুন!'); 
            document.getElementById('product_type').selectedIndex = 0;
            return; 
        }

        // ডিফল্ট ভ্যালু লোড করা
        let type = document.getElementById('product_type').value;
        let lock = document.getElementById('qty_lock');
        let handle = document.getElementById('qty_handle');
        let hinge = document.getElementById('qty_hinge');
        let channel = document.getElementById('qty_channel');
        let glass = document.getElementById('qty_glass');

        if (type === 'almirah_4') { lock.value = 5; handle.value = 4; hinge.value = 16; channel.value = 1; glass.value = 0; }
        else if (type === 'almirah_3') { lock.value = 4; handle.value = 3; hinge.value = 12; channel.value = 1; glass.value = 0; }
        else if (type === 'almirah_2') { lock.value = 3; handle.value = 2; hinge.value = 8; channel.value = 1; glass.value = 0; }
        else if (type === 'dressing_table') { lock.value = 3; handle.value = 3; hinge.value = 12; channel.value = 2; glass.value = 1; }
        else if (type === 'wardrobe_4d2dr') { lock.value = 6; handle.value = 6; hinge.value = 8; channel.value = 4; glass.value = 0; }
        else if (type === 'wardrobe_4d') { lock.value = 4; handle.value = 4; hinge.value = 0; channel.value = 4; glass.value = 0; }
        else { lock.value = 0; handle.value = 0; hinge.value = 0; channel.value = 0; glass.value = 0; }
        
        calculateLiveTotal();

        // ১ সেকেন্ডের একটি ছোট বিরতি দিয়ে অটো ২ নম্বর ধাপে চলে যাবে যাতে ইউজার বোঝে কী হচ্ছে
        setTimeout(() => {
            changeStep(1);
        }, 300);
    }

    function changeStep(direction) {
        if (currentStep === 1 && direction === 1) {
            let modelNo = document.getElementById('model_no').value.trim();
            if (!modelNo) { alert('দয়া করে প্রথমে মডেল নাম্বারটি লিখুন!'); return; }
        }

        document.getElementById(`step-${currentStep}`).classList.remove('active');
        document.getElementById(`ind-${currentStep}`).classList.remove('active');
        
        currentStep += direction;
        
        document.getElementById(`step-${currentStep}`).classList.add('active');
        document.getElementById(`ind-${currentStep}`).classList.add('active');
    }

    // উপরে ধাপে ধাপে টাচ করে যেকোনো সময় যেকোনো ধাপে যাওয়ার সুবিধা
    function jumpToStep(stepNum) {
        let modelNo = document.getElementById('model_no').value.trim();
        if (!modelNo && stepNum > 1) { alert('দয়া করে প্রথমে মডেল নাম্বারটি লিখুন!'); return; }

        document.getElementById(`step-${currentStep}`).classList.remove('active');
        document.getElementById(`ind-${currentStep}`).classList.remove('active');
        
        currentStep = stepNum;
        
        document.getElementById(`step-${currentStep}`).classList.add('active');
        document.getElementById(`ind-${currentStep}`).classList.add('active');
    }

    function stepInput(id, value) {
        let input = document.getElementById(id);
        let current = parseFloat(input.value) || 0;
        let newValue = current + value;
        if(newValue < 0) newValue = 0;
        input.value = newValue;
        calculateLiveTotal();
    }

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    window.onload = function() {
        if(localStorage.getItem('cfg_18mm')) {
            ['18mm','15mm','6mm','handle','channel','hinge','lock','glass'].forEach(id => {
                if(document.getElementById('cfg_'+id)) {
                    document.getElementById('cfg_'+id).value = localStorage.getItem('cfg_'+id);
                }
            });
        }
        
        const allInputs = document.querySelectorAll('#calcForm input, #calcForm select');
        allInputs.forEach(input => {
            input.addEventListener('input', calculateLiveTotal);
        });

        renderDatabase();
        calculateLiveTotal();
    }

    function saveRates(event) {
        event.preventDefault();
        ['18mm','15mm','6mm','handle','channel','hinge','lock','glass'].forEach(id => {
            localStorage.setItem('cfg_'+id, document.getElementById('cfg_'+id).value);
        });
        alert('নতুন রেট সফলভাবে আপডেট হয়েছে!');
        closeSettings();
        calculateLiveTotal();
    }

    function calculateLiveTotal() {
        let r18 = parseFloat(document.getElementById('cfg_18mm').value)||0;
        let r15 = parseFloat(document.getElementById('cfg_15mm').value)||0;
        let r6  = parseFloat(document.getElementById('cfg_6mm').value)||0;
        let rHand = parseFloat(document.getElementById('cfg_handle').value)||0;
        let rChan = parseFloat(document.getElementById('cfg_channel').value)||0;
        let rHinge = parseFloat(document.getElementById('cfg_hinge').value)||0;
        let rLock = parseFloat(document.getElementById('cfg_lock').value)||0;
        let rGlass = parseFloat(document.getElementById('cfg_glass').value)||0;

        let q18 = parseFloat(document.getElementById('qty_18mm').value)||0;
        let q15 = parseFloat(document.getElementById('qty_15mm').value)||0;
        let q6  = parseFloat(document.getElementById('qty_6mm').value)||0;
        let qHand = parseFloat(document.getElementById('qty_handle').value)||0;
        let qChan = parseFloat(document.getElementById('qty_channel').value)||0;
        let qHinge = parseFloat(document.getElementById('qty_hinge').value)||0;
        let qLock = parseFloat(document.getElementById('qty_lock').value)||0;
        let qGlass = parseFloat(document.getElementById('qty_glass').value)||0;

        let cCnc = parseFloat(document.getElementById('cost_cnc').value)||0;
        let cLacquer = parseFloat(document.getElementById('cost_lacquer').value)||0;
        let cFitting = parseFloat(document.getElementById('cost_fitting_labor').value)||0;
        let cColor = parseFloat(document.getElementById('cost_color_labor').value)||0;
        let cCarrying = parseFloat(document.getElementById('cost_carrying').value)||0;
        let cOthers = parseFloat(document.getElementById('cost_others').value)||0;

        calculatedBoardCost = (q18 * r18) + (q15 * r15) + (q6 * r6);
        calculatedHardwareCost = (qHand * rHand) + (qChan * rChan) + (qHinge * rHinge) + (qLock * rLock) + (qGlass * rGlass);
        calculatedLaborAndOtherCost = cCnc + cLacquer + cFitting + cColor + cCarrying + cOthers;

        currentCalculatedTotal = calculatedBoardCost + calculatedHardwareCost + calculatedLaborAndOtherCost;
        document.getElementById('grandTotal').innerText = currentCalculatedTotal.toLocaleString('bn-BD', { minimumFractionDigits: 2 }) + " টাকা";
    }

    function saveToDatabase() {
        let modelNo = document.getElementById('model_no').value.trim().toUpperCase();
        let productSelect = document.getElementById('product_type');
        let productText = productSelect.options[productSelect.selectedIndex].text;
        
        if(!modelNo) { alert('দয়া করে ১ম ধাপে গিয়ে মডেল নাম্বারটি লিখুন!'); return; }
        if(productSelect.value === "") { alert('দয়া করে ফার্নিচার আইটেম সিলেক্ট করুন!'); return; }
        if(currentCalculatedTotal === 0) { alert('কোনো খরচ ছাড়া হিসাব সেভ করা যাবে না।'); return; }

        let q18 = document.getElementById('qty_18mm').value || 0;
        let q15 = document.getElementById('qty_15mm').value || 0;
        let q6 = document.getElementById('qty_6mm').value || 0;
        let qLock = document.getElementById('qty_lock').value || 0;
        let qHand = document.getElementById('qty_handle').value || 0;
        let qHinge = document.getElementById('qty_hinge').value || 0;
        let qChan = document.getElementById('qty_channel').value || 0;
        let qGlass = document.getElementById('qty_glass').value || 0;
        
        let cCnc = document.getElementById('cost_cnc').value || 0;
        let cLac = document.getElementById('cost_lacquer').value || 0;
        let cFit = document.getElementById('cost_fitting_labor').value || 0;
        let cCol = document.getElementById('cost_color_labor').value || 0;
        let cCar = document.getElementById('cost_carrying').value || 0;
        let cOth = document.getElementById('cost_others').value || 0;

        let boardDetails = [];
        if(q18 > 0) boardDetails.push(`১৮মিলি: ${q18} পিস`);
        if(q15 > 0) boardDetails.push(`১৫মিলি: ${q15} পিস`);
        if(q6 > 0) boardDetails.push(`৬মিি প্লাই: ${q6} পিস`);
        
        let hardDetails = [];
        if(qLock > 0) hardDetails.push(`তালা: ${qLock}টি`);
        if(qHand > 0) hardDetails.push(`হ্যান্ডেল: ${qHand}টি`);
        if(qHinge > 0) hardDetails.push(`কব্জা: ${qHinge}টি`);
        if(qChan > 0) hardDetails.push(`চ্যানেল: ${qChan}সেট`);
        if(qGlass > 0) hardDetails.push(`গ্লাস: ${qGlass}টি`);

        let laborDetails = [];
        if(cCnc > 0) laborDetails.push(`CNC: ${cCnc}৳`);
        if(cLac > 0) laborDetails.push(`লেকার: ${cLac}৳`);
        if(cFit > 0) laborDetails.push(`ফিটিং: ${cFit}৳`);
        if(cCol > 0) laborDetails.push(`কালার: ${cCol}৳`);
        if(cCar > 0) laborDetails.push(`গাড়ি ভাড়া: ${cCar}৳`);
        if(cOth > 0) laborDetails.push(`খুচরা: ${cOth}৳`);

        let detailedHTML = '';
        if(boardDetails.length > 0) {
            detailedHTML += `<span class="cat-title">🪵 ১. বোর্ড হিসাব (মোট: ${calculatedBoardCost.toFixed(0)}৳)</span>
                             <div class="cat-details">${boardDetails.join(' | ')}</div>`;
        }
        if(hardDetails.length > 0) {
            detailedHTML += `<span class="cat-title">🔩 ২. হার্ডওয়্যার ও গ্লাস (মোট: ${calculatedHardwareCost.toFixed(0)}৳)</span>
                             <div class="cat-details">${hardDetails.join(' | ')}</div>`;
        }
        if(laborDetails.length > 0) {
            detailedHTML += `<span class="cat-title">🎨 ৩. মিস্ত্রি ও অন্যান্য (মোট: ${calculatedLaborAndOtherCost.toFixed(0)}৳)</span>
                             <div class="cat-details">${laborDetails.join(' | ')}</div>`;
        }

        let db = JSON.parse(localStorage.getItem('Base67_Data_Store')) || [];
        let existingItem = db.find(item => item.model === modelNo);

        if(existingItem) {
            existingItem.cost = existingItem.cost + " + " + currentCalculatedTotal.toFixed(0);
            existingItem.details = existingItem.details + `<div class="record-divider"></div>` + detailedHTML;
        } else {
            db.push({ model: modelNo, name: productText, cost: currentCalculatedTotal.toFixed(0), details: detailedHTML });
        }

        localStorage.setItem('Base67_Data_Store', JSON.stringify(db));
        renderDatabase();
        
        // ফর্ম ক্লিয়ার ও ধাপ ১-এ রিসেট করা
        document.getElementById('model_no').value = '';
        productSelect.selectedIndex = 0;
        document.getElementById(`step-${currentStep}`).classList.remove('active');
        document.getElementById(`ind-${currentStep}`).classList.remove('active');
        currentStep = 1;
        document.getElementById(`step-1`).classList.add('active');
        document.getElementById(`ind-1`).classList.add('active');
        
        alert('হিসাবটি সফলভাবে ডিজিটাল খাতায় সেভ করা হয়েছে!');
    }

    function renderDatabase() {
        let db = JSON.parse(localStorage.getItem('Base67_Data_Store')) || [];
        let rows = '';
        db.forEach((item, index) => {
            rows += `<tr id="row-${index}">
                <td><strong>${item.model}</strong><br><small style="color:#64748b; font-weight:500;">${item.name}</small></td>
                <td><div class="details-text">${item.details || 'কোনো বিবরণী নেই'}</div></td>
                <td><span class="plus-cost">${item.cost} ৳</span></td>
                <td class="no-capture" style="text-align:center; vertical-align:middle;">
                    <button class="btn-action-download" onclick="exportSingleRow(${index}, '${item.model}')">📸 ডাউনলোড</button>
                    <button class="btn-action-delete" onclick="deleteRow(${index})">ডিলিট</button>
                </td>
            </tr>`;
        });
        document.getElementById('dbRows').innerHTML = rows;
    }

    function exportSingleRow(index, modelName) {
        let targetRow = document.getElementById(`row-${index}`);
        let tempDiv = document.createElement('div');
        tempDiv.style.position = 'absolute';
        tempDiv.style.top = '-9999px';
        tempDiv.style.width = '480px';
        tempDiv.style.background = '#ffffff';
        tempDiv.style.padding = '25px';
        tempDiv.style.borderRadius = '12px';
        
        tempDiv.innerHTML = `
            <div style="text-align:center; margin-bottom: 20px; border-bottom: 3px double #2c3e50; padding-bottom: 10px;">
                <h2 style="color: #2c3e50; margin: 0; font-size:1.4rem;"> কারখানা রেকর্ড কপি</h2>
                <p style="color: #64748b; font-size: 0.8rem; margin: 5px 0 0 0;">একক প্রোডাক্ট উৎপাদন খরচ বিবরণী</p>
            </div>
            <div style="margin-bottom: 20px; background: #f8fafc; padding: 12px; border-radius: 8px; border-left: 5px solid #3498db;">
                <span style="font-size:0.85rem; color:#64748b;">মডেল ও আইটেম:</span>
                <h3 style="margin: 3px 0 0 0; color:#1e293b; font-size:1.15rem;">${targetRow.cells[0].innerHTML.replace('<br>', ' - ')}</h3>
            </div>
            <div style="margin-bottom: 25px;">
                ${targetRow.cells[1].innerHTML}
            </div>
            <div style="background: linear-gradient(135deg, #1e293b, #334155); color: white; padding: 15px; border-radius: 10px; text-align: center;">
                <span style="font-size: 0.85rem; color: #cbd5e1; display:block;">সর্বমোট উৎপাদন খরচ</span>
                <span style="font-size: 1.6rem; font-weight: bold; color: #2ecc71;">${targetRow.cells[2].innerText}</span>
            </div>
            <div style="text-align:center; margin-top:20px; font-size:0.7rem; color:#94a3b8; border-top:1px solid #e2e8f0; padding-top:10px;">
                ডিজিটাল খাতা জেনারেটেড কপি • 
            </div>
        `;
        
        document.body.appendChild(tempDiv);

        html2canvas(tempDiv, { scale: 2, useCORS: true }).then(canvas => {
            let imgData = canvas.toDataURL('image/png');
            let a = document.createElement('a');
            a.href = imgData;
            a.download = `Cost_Report_${modelName}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            document.body.removeChild(tempDiv);
        }).catch(err => {
            alert('দুঃখিত, ছবি তৈরিতে সমস্যা হয়েছে।');
            if(tempDiv) document.body.removeChild(tempDiv);
        });
    }

    function deleteRow(index) {
        if(confirm('আপনি কি নিশ্চিত যে এই হিসাবটি খাতা থেকে চিরতরে মুছে ফেলতে চান?')) {
            let db = JSON.parse(localStorage.getItem('Base67_Data_Store')) || [];
            db.splice(index, 1);
            localStorage.setItem('Base67_Data_Store', JSON.stringify(db));
            renderDatabase();
        }
    }

    function exportToImage() {
        let db = JSON.parse(localStorage.getItem('Base67_Data_Store')) || [];
        if(db.length === 0) { alert('খাতায় কোনো ডাটা নেই! আগে কিছু হিসাব সেভ করুন।'); return; }

        let deleteButtons = document.querySelectorAll('.no-capture');
        let actionHead = document.querySelector('.action-head');
        
        deleteButtons.forEach(btn => btn.style.display = 'none');
        if(actionHead) actionHead.style.display = 'none';

        let element = document.getElementById('capture_area');
        html2canvas(element, { scale: 2, useCORS: true }).then(canvas => {
            let imgData = canvas.toDataURL('image/png');
            let a = document.createElement('a');
            a.href = imgData;
            a.download = 'Base67_All_Khata.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            deleteButtons.forEach(btn => btn.style.display = 'block');
            if(actionHead) actionHead.style.display = 'table-cell';
        }).catch(err => {
            alert('দুঃখিত, ছবি তৈরিতে সমস্যা হয়েছে।');
            deleteButtons.forEach(btn => btn.style.display = 'block');
            if(actionHead) actionHead.style.display = 'table-cell';
        });
    }
</script>
</body>
</html>
